name: Debug Python Runtime

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download and inspect
        run: |
          set -e

          PY_BUILD_RELEASE="20260921"
          PY_VERSION="3.14"

          echo "======================================"
          echo "STEP 1: Tải manifest.json"
          echo "======================================"
          MANIFEST_URL="https://github.com/flet-dev/python-build/releases/download/${PY_BUILD_RELEASE}/manifest.json"
          echo "URL: $MANIFEST_URL"
          wget -O manifest.json "$MANIFEST_URL"
          echo "✅ Manifest size: $(wc -c < manifest.json) bytes"
          echo ""
          echo "Nội dung manifest (30 dòng đầu):"
          head -30 manifest.json
          echo ""
          FULL_VERSION=$(jq -r --arg pv "$PY_VERSION" '.pythons[$pv].full_version // empty' manifest.json)
          echo "📌 Full version: '$FULL_VERSION'"
          if [ -z "$FULL_VERSION" ]; then
            echo "❌ Không extract được full_version từ manifest!"
            echo "Keys có sẵn:"
            jq -r '.pythons | keys[]' manifest.json
            exit 1
          fi

          echo ""
          echo "======================================"
          echo "STEP 2: Tải tarball"
          echo "======================================"
          ABI="arm64-v8a"
          TARBALL="python-android-dart-${FULL_VERSION}-${ABI}.tar.gz"
          URL="https://github.com/flet-dev/python-build/releases/download/${PY_BUILD_RELEASE}/${TARBALL}"
          echo "URL: $URL"
          mkdir -p _python_runtime
          cd _python_runtime
          wget -O "$TARBALL" "$URL"
          echo "✅ Tarball size: $(du -h "$TARBALL" | cut -f1)"
          echo ""

          echo "======================================"
          echo "STEP 3: Liệt kê nội dung tarball (chưa extract)"
          echo "======================================"
          echo "30 entry đầu:"
          tar -tzf "$TARBALL" | head -30
          echo ""
          echo "Tổng số entry: $(tar -tzf "$TARBALL" | wc -l)"
          echo ""
          echo "Tìm trong tarball:"
          echo "  os.py:      $(tar -tzf "$TARBALL" | grep 'os\.py$' | head -3)"
          echo "  libpython:  $(tar -tzf "$TARBALL" | grep 'libpython.*\.so' | head -3)"
          echo "  Python.h:   $(tar -tzf "$TARBALL" | grep 'Python\.h$' | head -3)"

          echo ""
          echo "======================================"
          echo "STEP 4: Extract"
          echo "======================================"
          tar -xzf "$TARBALL"
          echo "Exit code tar: $?"
          echo ""
          echo "======================================"
          echo "STEP 5: Kiểm tra sau extract"
          echo "======================================"
          echo "Working dir: $(pwd)"
          echo ""
          echo "ls -la:"
          ls -la
          echo ""
          echo "find . -maxdepth 2 -type d:"
          find . -maxdepth 2 -type d | head -30
          echo ""
          echo "find . -name '*.py' (10 đầu):"
          find . -name "*.py" | head -10
          echo ""
          echo "find . -name 'libpython*.so':"
          find . -name "libpython*.so"
          echo ""
          echo "find . -name 'Python.h':"
          find . -name "Python.h"
          echo ""
          echo "Total size:"
          du -sh .
          echo ""
          echo "======================================"
          echo "DONE"
          echo "======================================"