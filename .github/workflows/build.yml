name: Build APK with Self-Built Python

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]
  push:
    branches:
      - nam348tnh3gp-patch-1
      - main

concurrency:
  group: build-apk
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHON_VERSION: "3.13.1"
      OPENSSL_VERSION: "3.3.2"
      LIBFFI_VERSION: "3.4.6"
      SQLITE_VERSION: "3460100"
      SQLITE_YEAR: "2024"
      XZ_VERSION: "5.4.6"
      ANDROID_API: "24"
      TARGET_HOST: "aarch64-linux-android"

    steps:
      # ==========================================================
      # SECTION 1: ENVIRONMENT SETUP
      # ==========================================================
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            pkg-config wget curl unzip git xz-utils python3 python3-pip patchelf

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Setup Android NDK r25c
        run: |
          mkdir -p "$HOME/ndk"
          cd "$HOME/ndk"
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "NDK=$HOME/ndk/android-ndk-r25c" >> "$GITHUB_ENV"
          echo "$HOME/ndk/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify bridge script exists
        run: |
          if [ ! -f app/src/main/python/yt_dlp_bridge.py ]; then
            echo "Missing app/src/main/python/yt_dlp_bridge.py"
            find app -name "yt_dlp_bridge.py" || true
            exit 1
          fi
          echo "Bridge script found"

      # ==========================================================
      # SECTION 2: VERSION BUMP
      # ==========================================================
      - name: Bump version code
        id: bump
        run: |
          set -e
          if [ -f versioncode.txt ]; then
            CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
            CURRENT=${CURRENT:-0}
          else
            CURRENT=0
          fi
          if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then CURRENT=0; fi
          NEW=$((CURRENT + 1))
          echo "$NEW" > versioncode.txt
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versioncode.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: bump version code to ${{ steps.bump.outputs.new_version }} [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      # ==========================================================
      # SECTION 3: HOST PYTHON
      # ==========================================================
      - name: Build Host Python
        run: |
          mkdir -p /tmp/build-host
          cd /tmp/build-host
          wget -q "https://www.python.org/ftp/python/${{ env.PYTHON_VERSION }}/Python-${{ env.PYTHON_VERSION }}.tar.xz"
          tar -xf "Python-${{ env.PYTHON_VERSION }}.tar.xz"
          cd "Python-${{ env.PYTHON_VERSION }}"
          ./configure --prefix=/tmp/host-python --enable-optimizations=no
          make -j$(nproc)
          make install
          echo "HOST_PYTHON=/tmp/host-python/bin/python3" >> "$GITHUB_ENV"

      - name: Export Cross-Compile Environment
        run: |
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          DEPS_INSTALL="$GITHUB_WORKSPACE/deps-install"
          mkdir -p "$DEPS_INSTALL"

          echo "CC=$TOOLCHAIN/bin/${{ env.TARGET_HOST }}${{ env.ANDROID_API }}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/${{ env.TARGET_HOST }}${{ env.ANDROID_API }}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "DEPS_INSTALL=$DEPS_INSTALL" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$DEPS_INSTALL/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=$DEPS_INSTALL" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$DEPS_INSTALL/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CFLAGS=-fPIC -O2 -I$DEPS_INSTALL/include -Wno-implicit-function-declaration" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$DEPS_INSTALL/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$DEPS_INSTALL/lib" >> "$GITHUB_ENV"

      # ==========================================================
      # SECTION 4: CROSS-COMPILE DEPENDENCIES
      # KHÔNG cross-compile zlib — NDK đã có libz.so + zlib.h trong sysroot
      # ==========================================================

      - name: Cross-Compile libffi
        run: |
          cd /tmp
          wget -q "https://github.com/libffi/libffi/releases/download/v${{ env.LIBFFI_VERSION }}/libffi-${{ env.LIBFFI_VERSION }}.tar.gz"
          tar -xf "libffi-${{ env.LIBFFI_VERSION }}.tar.gz"
          cd "libffi-${{ env.LIBFFI_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" --enable-static --disable-shared
          make -j$(nproc) install

      - name: Cross-Compile OpenSSL
        run: |
          cd /tmp
          wget -q "https://www.openssl.org/source/openssl-${{ env.OPENSSL_VERSION }}.tar.gz"
          tar -xf "openssl-${{ env.OPENSSL_VERSION }}.tar.gz"
          cd "openssl-${{ env.OPENSSL_VERSION }}"

          export ANDROID_NDK_ROOT="$NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          ./Configure android-arm64 \
            -D__ANDROID_API__=${{ env.ANDROID_API }} \
            --prefix="$DEPS_INSTALL" \
            --openssldir="$DEPS_INSTALL/ssl" \
            shared no-engine no-tests no-async \
            CC="$CC" \
            CXX="$CXX" \
            AR="$AR" \
            RANLIB="$RANLIB" \
            STRIP="$STRIP"

          make -j$(nproc)
          make install_sw

      - name: Cross-Compile SQLite3
        run: |
          cd /tmp
          SQLITE_URL="https://www.sqlite.org/${{ env.SQLITE_YEAR }}/sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz"
          if ! curl --output /dev/null --silent --head --fail "$SQLITE_URL"; then
            SQLITE_URL="https://www.sqlite.org/2023/sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz"
          fi
          echo "Downloading: $SQLITE_URL"
          wget -q "$SQLITE_URL"
          tar -xf "sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz"
          cd "sqlite-autoconf-${{ env.SQLITE_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" --enable-static --disable-shared
          make -j$(nproc) install

      - name: Cross-Compile XZ
        run: |
          cd /tmp
          wget -q "https://github.com/tukaani-project/xz/releases/download/v${{ env.XZ_VERSION }}/xz-${{ env.XZ_VERSION }}.tar.gz"
          tar -xf "xz-${{ env.XZ_VERSION }}.tar.gz"
          cd "xz-${{ env.XZ_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" --enable-static --disable-shared
          make -j$(nproc) install

      # ==========================================================
      # SECTION 5: CROSS-COMPILE CPYTHON 3.13
      # ==========================================================
      - name: Cross-Compile CPython
        run: |
          cd /tmp
          tar -xf "/tmp/build-host/Python-${{ env.PYTHON_VERSION }}.tar.xz"
          cd "Python-${{ env.PYTHON_VERSION }}"

          printf '%s\n' \
            '*disabled*' \
            '_crypt' \
            '_nis' \
            'spwd' \
            'ossaudiodev' \
            '_curses' \
            '_curses_panel' \
            'readline' \
            '_multiprocessing' \
            'nis' \
            > Modules/Setup.local

          OPENSSL_CFLAGS="-I$DEPS_INSTALL/include" \
          OPENSSL_LIBS="-L$DEPS_INSTALL/lib -lssl -lcrypto" \
          LIBFFI_CFLAGS="-I$DEPS_INSTALL/include" \
          LIBFFI_LIBS="-L$DEPS_INSTALL/lib -lffi" \
          SQLITE3_CFLAGS="-I$DEPS_INSTALL/include" \
          SQLITE3_LIBS="-L$DEPS_INSTALL/lib -lsqlite3" \
          LZMA_CFLAGS="-I$DEPS_INSTALL/include" \
          LZMA_LIBS="-L$DEPS_INSTALL/lib -llzma" \
          ./configure \
            --host="${{ env.TARGET_HOST }}" \
            --build=x86_64-pc-linux-gnu \
            --prefix="$GITHUB_WORKSPACE/python-android" \
            --with-build-python="$HOST_PYTHON" \
            --enable-shared \
            --disable-ipv6 \
            --without-ensurepip \
            --with-openssl="$DEPS_INSTALL" \
            ac_cv_file__dev_ptmx=no \
            ac_cv_file__dev_ptc=no \
            ac_cv_buggy_getaddrinfo=no \
            ac_cv_little_endian_double=yes

          make -j$(nproc)
          make install

          echo "Critical modules:"
          ls "$GITHUB_WORKSPACE/python-android/lib/python3.13/lib-dynload/" | grep -E "_ssl|_sqlite|_ctypes|_lzma|zlib" || true

      # ==========================================================
      # SECTION 6: BOOTSTRAP WHEELS + PATCH PATHS
      # ==========================================================
      - name: Bootstrap Pure-Python Wheels
        run: |
          TARGET_SITE="$GITHUB_WORKSPACE/python-android/lib/python3.13/site-packages"
          mkdir -p /tmp/wheels "$TARGET_SITE"

          "$HOST_PYTHON" -m pip download \
            yt-dlp certifi setuptools wheel pip mutagen \
            --dest=/tmp/wheels --only-binary=:all: --no-deps

          for whl in /tmp/wheels/*.whl; do
            echo "Extracting: $(basename "$whl")"
            unzip -o -q "$whl" -d "$TARGET_SITE"
          done

      - name: Strip Binaries and Patch Hardcoded Paths
        run: |
          find "$GITHUB_WORKSPACE/python-android" -name "*.so*" \
            -exec "$STRIP" --strip-unneeded {} \; 2>/dev/null || true
          "$STRIP" --strip-unneeded "$GITHUB_WORKSPACE/python-android/bin/python3.13" 2>/dev/null || true

          find "$GITHUB_WORKSPACE/python-android" -type f \
            \( -name "_sysconfigdata*.py" -o -name "*.pc" -o -name "*-config" -o -name "Makefile" \) \
            -exec sed -i "s|$GITHUB_WORKSPACE/python-android|/data/data/com.nam2006.y2mate/files/python|g" {} \;

      # ==========================================================
      # SECTION 7: COLLECT jniLibs + PATCH NEEDED + RPATH
      # ==========================================================
      - name: Collect and Process Native Libraries
        run: |
          JNI="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          DYNLIB="$GITHUB_WORKSPACE/python-android/lib/python3.13/lib-dynload"
          PY_LIB="$GITHUB_WORKSPACE/python-android/lib"
          mkdir -p "$JNI"

          cp "$PY_LIB/libpython3.13.so" "$JNI/"
          find "$DEPS_INSTALL/lib" -maxdepth 1 -name "*.so*" -exec cp {} "$JNI/" \; 2>/dev/null || true

          echo "Before rename:"
          ls -lh "$JNI/"

          for f in "$JNI"/*.so.*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            new=$(echo "$base" | sed -E 's/(\.so)\.[0-9]+(\.[0-9]+)*$/\1/')
            [ "$new" = "$base" ] && continue
            mv "$f" "$JNI/$new"
            echo "Renamed: $base -> $new"
          done

          PATCHED=0
          for so in "$JNI/libpython3.13.so" "$PY_LIB/libpython3.13.so" "$DYNLIB"/*.so; do
            [ -f "$so" ] || continue
            for needed in $(readelf -d "$so" 2>/dev/null | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/'); do
              new_needed=$(echo "$needed" | sed -E 's/(\.so)\.[0-9]+(\.[0-9]+)*$/\1/')
              if [ "$new_needed" != "$needed" ] && [ -f "$JNI/$new_needed" ]; then
                patchelf --replace-needed "$needed" "$new_needed" "$so"
                PATCHED=$((PATCHED+1))
              fi
            done
          done
          echo "Patched $PATCHED NEEDED entries"

          for so in "$JNI/libpython3.13.so" "$JNI/libssl.so" "$JNI/libcrypto.so"; do
            [ -f "$so" ] && patchelf --force-rpath --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done

          for so in "$DYNLIB"/*.so; do
            [ -f "$so" ] && patchelf --force-rpath --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done

          SSL_SO=$(ls "$DYNLIB"/_ssl*.so 2>/dev/null | head -1)
          if [ -z "$SSL_SO" ]; then
            echo "CRITICAL: _ssl module missing!"
            exit 1
          fi
          echo "ssl module: $(basename "$SSL_SO")"

          echo "Final jniLibs:"
          ls -lh "$JNI/"

      # ==========================================================
      # SECTION 8: PACKAGE RUNTIME TAR (không nén — dùng .tar thuần)
      # ==========================================================
      - name: Package Python Runtime into Assets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"

          cp "$GITHUB_WORKSPACE/app/src/main/python/yt_dlp_bridge.py" \
             "$GITHUB_WORKSPACE/app/src/main/assets/yt_dlp_bridge.py"
          echo "yt_dlp_bridge.py copied"

          # Dọn asset cũ (nếu có) để tránh lẫn lộn giữa .tar và .tar.gz
          rm -f "$GITHUB_WORKSPACE/app/src/main/assets/python-runtime.tar" \
                "$GITHUB_WORKSPACE/app/src/main/assets/python-runtime.tar.gz"

          cd "$GITHUB_WORKSPACE/python-android"
          # tar thuần, KHÔNG nén gzip
          tar -cvf "$GITHUB_WORKSPACE/app/src/main/assets/python-runtime.tar" lib/python3.13

          cd "$GITHUB_WORKSPACE"
          SIZE=$(stat -c%s app/src/main/assets/python-runtime.tar)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Runtime tar: ${SIZE_MB} MB ($SIZE bytes)"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "Runtime tar too small"
            exit 1
          fi

          echo "Tar contents:"
          tar -tvf app/src/main/assets/python-runtime.tar | head -10
          echo "Assets:"
          ls -lh app/src/main/assets/

      # ==========================================================
      # SECTION 9: FFMPEG FROM TERMUX
      # ==========================================================
      - name: Download FFmpeg from Termux
        run: |
          set -e
          FFMPEG_VERSION="8.1.3"
          ARCH="aarch64"
          DEB_URL="https://packages.termux.dev/apt/termux-main/pool/main/f/ffmpeg/ffmpeg_${FFMPEG_VERSION}_${ARCH}.deb"
          wget -q -O ffmpeg.deb "$DEB_URL"
          mkdir -p ffmpeg-extracted
          dpkg-deb -xv ffmpeg.deb ./ffmpeg-extracted

          TERMUX_BIN="./ffmpeg-extracted/data/data/com.termux/files/usr/bin"
          TERMUX_LIB="./ffmpeg-extracted/data/data/com.termux/files/usr/lib"

          mkdir -p app/src/main/assets/ffmpeg/lib
          cp "${TERMUX_BIN}/ffmpeg" app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          if [ -f "${TERMUX_BIN}/ffprobe" ]; then
            cp "${TERMUX_BIN}/ffprobe" app/src/main/jniLibs/arm64-v8a/libffprobe.so
          fi

          find "$TERMUX_LIB" -maxdepth 1 -type f \
            \( -name "libav*.so*" -o -name "libsw*.so*" -o -name "libpostproc*.so*" \) \
            -exec cp {} app/src/main/assets/ffmpeg/lib/ \;

          chmod 755 app/src/main/jniLibs/arm64-v8a/libffmpeg.so

          echo "jniLibs final:"
          ls -lh app/src/main/jniLibs/arm64-v8a/

      # ==========================================================
      # SECTION 10: BUILD APK
      # ==========================================================
      - name: Setup debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -f "debug.keystore" ]; then
            cp debug.keystore "$HOME/.android/debug.keystore"
          else
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          VERSION=${{ steps.bump.outputs.new_version }}
          for f in app/build/outputs/apk/release/*.apk; do
            if [[ "$f" != *".apk" ]] || [[ "$f" == *"-unaligned"* ]]; then continue; fi
            DIR=$(dirname "$f")
            BASE=$(basename "$f" .apk)
            mv "$f" "${DIR}/${BASE}-v${VERSION}.apk"
          done
          ls -la app/build/outputs/apk/release/

      - name: Report final sizes
        run: |
          echo "APK:"
          ls -lh app/build/outputs/apk/release/*.apk
          echo ""
          echo "Component sizes:"
          du -sh app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          du -sh app/src/main/assets/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: Mini-Y2mate-Pro-v${{ steps.bump.outputs.new_version }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30