name: Build APK & Plugin

on:
  workflow_dispatch:
  repository_dispatch:
    types: [build-apk]
  push:
    branches:
      - main
      - nam348tnh3gp-patch-1
    paths:
      - 'app/**'
      - 'plugin/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'versioncode.txt'
      - 'plugin/versioncode.txt'
      - '.github/workflows/build.yml'

concurrency:
  group: build-all-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ============================================================
  # JOB 0: Detect thay đổi
  # ============================================================
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      app: ${{ steps.filter.outputs.app }}
      plugin: ${{ steps.filter.outputs.plugin }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            app:
              - 'app/**'
              - 'settings.gradle.kts'
              - 'build.gradle.kts'
              - 'versioncode.txt'
              - '.github/workflows/build.yml'
            plugin:
              - 'plugin/**'
              - 'settings.gradle.kts'
              - 'plugin/versioncode.txt'
              - '.github/workflows/build.yml'

  # ============================================================
  # JOB 1: Build App chính (có cache)
  # ============================================================
  build-app:
    needs: changes
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      PYTHON_VERSION: "3.13.1"
      OPENSSL_VERSION: "3.3.2"
      LIBFFI_VERSION: "3.4.6"
      SQLITE_VERSION: "3460100"
      SQLITE_YEAR: "2024"
      XZ_VERSION: "5.4.6"
      NDK_VERSION: "r25c"
      ANDROID_API: "24"
      TARGET_HOST: "aarch64-linux-android"
      # [FIX v3] Invalidate cache cũ (v1/v2) có thể chứa libpython đã bị strip dynsym
      CACHE_VERSION: "v3-symbol-fix"

    steps:
      # ---------- SECTION 1: ENVIRONMENT SETUP ----------
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Host Tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list 2>/dev/null || true

          sudo apt-get update \
            -o Acquire::http::Timeout=15 \
            -o Acquire::https::Timeout=15 \
            -o Acquire::Retries=1 \
            -o Acquire::ForceIPv4=true \
            -qq || true

          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool \
            pkg-config wget curl unzip git xz-utils python3 python3-pip patchelf \
            binutils

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # ---------- CACHE: NDK ----------
      - name: Cache Android NDK
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: .cache/ndk
          key: ndk-${{ env.NDK_VERSION }}-${{ runner.os }}-${{ env.CACHE_VERSION }}

      - name: Download Android NDK
        if: steps.cache-ndk.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/ndk
          cd .cache/ndk
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          rm -f android-ndk-r25c-linux.zip
          echo "✅ NDK downloaded"

      - name: Setup NDK env
        run: |
          NDK_ABS="$GITHUB_WORKSPACE/.cache/ndk/android-ndk-r25c"
          if [ ! -d "$NDK_ABS" ]; then
            echo "❌ NDK không tồn tại: $NDK_ABS"
            exit 1
          fi
          echo "NDK=$NDK_ABS" >> "$GITHUB_ENV"
          echo "$NDK_ABS/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"
          echo "✅ NDK=$NDK_ABS"

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Verify bridge scripts exist
        run: |
          if [ ! -f app/src/main/python/yt_dlp_bridge.py ]; then
            echo "Missing app/src/main/python/yt_dlp_bridge.py"
            exit 1
          fi
          if [ ! -f app/src/main/python/py_runner.py ]; then
            echo "Missing app/src/main/python/py_runner.py"
            exit 1
          fi
          echo "✅ Bridge scripts found"

      # ---------- SECTION 2: VERSION BUMP ----------
      - name: Bump version code
        id: bump
        run: |
          set -e
          if [ -f versioncode.txt ]; then
            CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
            CURRENT=${CURRENT:-0}
          else
            CURRENT=0
          fi
          if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then CURRENT=0; fi
          NEW=$((CURRENT + 1))
          echo "$NEW" > versioncode.txt
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versioncode.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore: bump version code to ${{ steps.bump.outputs.new_version }} [skip ci]"
            for i in 1 2 3 4 5; do
              if git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
                break
              fi
              sleep 5
            done
          fi

      # ---------- CACHE: HOST PYTHON ----------
      - name: Cache Host Python + source
        id: cache-host
        uses: actions/cache@v4
        with:
          path: |
            .cache/build-host
            .cache/host-python
          key: host-python-${{ env.PYTHON_VERSION }}-${{ runner.os }}-${{ env.CACHE_VERSION }}

      # ---------- SECTION 3: HOST PYTHON ----------
      - name: Build Host Python
        if: steps.cache-host.outputs.cache-hit != 'true'
        run: |
          mkdir -p .cache/build-host
          cd .cache/build-host
          wget -q "https://www.python.org/ftp/python/${{ env.PYTHON_VERSION }}/Python-${{ env.PYTHON_VERSION }}.tar.xz"
          tar -xf "Python-${{ env.PYTHON_VERSION }}.tar.xz"
          cd "Python-${{ env.PYTHON_VERSION }}"
          ./configure --prefix="$GITHUB_WORKSPACE/.cache/host-python" --disable-optimizations
          make -j$(nproc)
          make install
          echo "✅ Host Python built"

      - name: Setup Host Python env
        run: |
          HOST_PY_ABS="$GITHUB_WORKSPACE/.cache/host-python/bin/python3"
          if [ ! -f "$HOST_PY_ABS" ]; then
            echo "❌ Host Python không tồn tại: $HOST_PY_ABS"
            exit 1
          fi
          echo "HOST_PYTHON=$HOST_PY_ABS" >> "$GITHUB_ENV"
          echo "BUILD_HOST_SRC=$GITHUB_WORKSPACE/.cache/build-host" >> "$GITHUB_ENV"
          "$HOST_PY_ABS" --version

      - name: Export Cross-Compile Environment
        run: |
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          DEPS_INSTALL="$GITHUB_WORKSPACE/deps-install"
          mkdir -p "$DEPS_INSTALL"

          echo "CC=$TOOLCHAIN/bin/${{ env.TARGET_HOST }}${{ env.ANDROID_API }}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/${{ env.TARGET_HOST }}${{ env.ANDROID_API }}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "READELF=$TOOLCHAIN/bin/llvm-readelf" >> "$GITHUB_ENV"
          echo "NM=$TOOLCHAIN/bin/llvm-nm" >> "$GITHUB_ENV"
          echo "DEPS_INSTALL=$DEPS_INSTALL" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$DEPS_INSTALL/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$DEPS_INSTALL/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=" >> "$GITHUB_ENV"
          echo "CFLAGS=-fPIC -O2 -I$DEPS_INSTALL/include -Wno-implicit-function-declaration" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$DEPS_INSTALL/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$DEPS_INSTALL/lib -Wl,--hash-style=both" >> "$GITHUB_ENV"

      # ---------- CACHE: CROSS-COMPILE DEPS ----------
      - name: Cache cross-compile deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: deps-install
          key: deps-${{ env.PYTHON_VERSION }}-ssl${{ env.OPENSSL_VERSION }}-ffi${{ env.LIBFFI_VERSION }}-sqlite${{ env.SQLITE_VERSION }}-xz${{ env.XZ_VERSION }}-${{ runner.os }}-${{ env.CACHE_VERSION }}

      # ---------- SECTION 4: CROSS-COMPILE DEPENDENCIES ----------
      - name: Cross-Compile libffi
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://github.com/libffi/libffi/releases/download/v${{ env.LIBFFI_VERSION }}/libffi-${{ env.LIBFFI_VERSION }}.tar.gz"
          tar -xf "libffi-${{ env.LIBFFI_VERSION }}.tar.gz"
          cd "libffi-${{ env.LIBFFI_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" \
            --enable-static --disable-shared \
            LDFLAGS="-Wl,--hash-style=both"
          make -j$(nproc) install

      - name: Cross-Compile OpenSSL
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://www.openssl.org/source/openssl-${{ env.OPENSSL_VERSION }}.tar.gz"
          tar -xf "openssl-${{ env.OPENSSL_VERSION }}.tar.gz"
          cd "openssl-${{ env.OPENSSL_VERSION }}"

          export ANDROID_NDK_ROOT="$NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          LDFLAGS="-Wl,--hash-style=both" \
          ./Configure android-arm64 \
            -D__ANDROID_API__=${{ env.ANDROID_API }} \
            --prefix="$DEPS_INSTALL" \
            --openssldir="$DEPS_INSTALL/ssl" \
            shared no-engine no-tests no-async \
            CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" STRIP="$STRIP"

          make -j$(nproc)
          make install_sw

      - name: Cross-Compile SQLite3
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          SQLITE_URL="https://www.sqlite.org/${{ env.SQLITE_YEAR }}/sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz"
          if ! curl --output /dev/null --silent --head --fail "$SQLITE_URL"; then
            SQLITE_URL="https://www.sqlite.org/2023/sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz"
          fi
          wget -q "$SQLITE_URL"
          tar -xf "sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz"
          cd "sqlite-autoconf-${{ env.SQLITE_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" \
            --enable-static --disable-shared \
            LDFLAGS="-Wl,--hash-style=both"
          make -j$(nproc) install

      - name: Cross-Compile XZ
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://github.com/tukaani-project/xz/releases/download/v${{ env.XZ_VERSION }}/xz-${{ env.XZ_VERSION }}.tar.gz"
          tar -xf "xz-${{ env.XZ_VERSION }}.tar.gz"
          cd "xz-${{ env.XZ_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" \
            --enable-static --disable-shared \
            LDFLAGS="-Wl,--hash-style=both"
          make -j$(nproc) install

      - name: Verify deps-install
        run: |
          echo "=== deps-install/lib ==="
          ls -lh "$DEPS_INSTALL/lib/" | head -20
          echo ""
          echo "=== deps-install/include ==="
          ls "$DEPS_INSTALL/include/" | head -10

      # ---------- CACHE: CPYTHON RUNTIME ----------
      - name: Cache python-android
        id: cache-python
        uses: actions/cache@v4
        with:
          path: python-android
          key: python-android-${{ env.PYTHON_VERSION }}-ssl${{ env.OPENSSL_VERSION }}-ffi${{ env.LIBFFI_VERSION }}-sqlite${{ env.SQLITE_VERSION }}-xz${{ env.XZ_VERSION }}-${{ runner.os }}-${{ env.CACHE_VERSION }}

      # ============================================================
      # SECTION 5: CROSS-COMPILE CPYTHON 3.13 — DT_HASH fix
      # ============================================================
      - name: Cross-Compile CPython
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          tar -xf "$BUILD_HOST_SRC/Python-${{ env.PYTHON_VERSION }}.tar.xz"
          cd "Python-${{ env.PYTHON_VERSION }}"

          printf '%s\n' \
            '*disabled*' '_crypt' '_nis' 'spwd' 'ossaudiodev' \
            '_curses' '_curses_panel' 'readline' '_multiprocessing' 'nis' \
            > Modules/Setup.local

          export LDSHARED="$CC -shared -Wl,--hash-style=both"
          export BLDSHARED="$CC -shared -Wl,--hash-style=both"
          export CCSHARED="-fPIC -Wl,--hash-style=both"
          export LDCXXSHARED="$CXX -shared -Wl,--hash-style=both"
          export LINKFORSHARED="-Wl,--hash-style=both -Xlinker -export-dynamic"

          LDFLAGS="-L$DEPS_INSTALL/lib -Wl,--hash-style=both" \
          OPENSSL_CFLAGS="-I$DEPS_INSTALL/include" \
          OPENSSL_LIBS="-L$DEPS_INSTALL/lib -lssl -lcrypto" \
          LIBFFI_CFLAGS="-I$DEPS_INSTALL/include" \
          LIBFFI_LIBS="-L$DEPS_INSTALL/lib -lffi" \
          SQLITE3_CFLAGS="-I$DEPS_INSTALL/include" \
          SQLITE3_LIBS="-L$DEPS_INSTALL/lib -lsqlite3" \
          LZMA_CFLAGS="-I$DEPS_INSTALL/include" \
          LZMA_LIBS="-L$DEPS_INSTALL/lib -llzma" \
          ./configure \
            --host="${{ env.TARGET_HOST }}" \
            --build=x86_64-pc-linux-gnu \
            --prefix="$GITHUB_WORKSPACE/python-android" \
            --with-build-python="$HOST_PYTHON" \
            --enable-shared \
            --disable-ipv6 \
            --without-ensurepip \
            --with-openssl="$DEPS_INSTALL" \
            ac_cv_file__dev_ptmx=no \
            ac_cv_file__dev_ptc=no \
            ac_cv_buggy_getaddrinfo=no \
            ac_cv_little_endian_double=yes

          sed -i "s|^LDSHARED=.*|LDSHARED= $CC -shared -Wl,--hash-style=both|" Makefile
          sed -i "s|^BLDSHARED=.*|BLDSHARED= $CC -shared -Wl,--hash-style=both|" Makefile
          sed -i "s|^CCSHARED=.*|CCSHARED= -fPIC -Wl,--hash-style=both|" Makefile
          sed -i "s|^LDCXXSHARED=.*|LDCXXSHARED= $CXX -shared -Wl,--hash-style=both|" Makefile
          sed -i "s|^LINKFORSHARED=.*|LINKFORSHARED= -Wl,--hash-style=both -Xlinker -export-dynamic|" Makefile

          echo "=== Makefile sau patch ==="
          grep -E "^LDSHARED=|^BLDSHARED=|^CCSHARED=|^LDCXXSHARED=|^LINKFORSHARED=" Makefile

          make -j$(nproc) \
            LDSHARED="$CC -shared -Wl,--hash-style=both" \
            BLDSHARED="$CC -shared -Wl,--hash-style=both" \
            CCSHARED="-fPIC -Wl,--hash-style=both" \
            LDCXXSHARED="$CXX -shared -Wl,--hash-style=both" \
            LINKFORSHARED="-Wl,--hash-style=both -Xlinker -export-dynamic"
          make install

          echo "Critical modules:"
          ls "$GITHUB_WORKSPACE/python-android/lib/python3.13/lib-dynload/" | grep -E "_ssl|_sqlite|_ctypes|_lzma|zlib|_posixsubprocess" || true

          echo ""
          echo "Verify hash style trên libpython3.13.so:"
          readelf -d "$GITHUB_WORKSPACE/python-android/lib/libpython3.13.so" | grep -iE "hash" || true

      # ============================================================
      # SECTION 5.5: VERIFY DT_HASH + SYMBOLS
      # ============================================================
      - name: Verify DT_HASH on CPython extensions
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          LIBDYLOAD="$GITHUB_WORKSPACE/python-android/lib/python3.13/lib-dynload"
          FAIL=0

          LP="$GITHUB_WORKSPACE/python-android/lib/libpython3.13.so"
          if [ -f "$LP" ]; then
            has_sysv=$(readelf --dynamic "$LP" 2>/dev/null | grep -E "\(HASH\)" | grep -v "GNU_HASH" | wc -l)
            has_gnu=$(readelf --dynamic "$LP" 2>/dev/null | grep -c "GNU_HASH" || true)
            echo "libpython3.13.so: SysV=$has_sysv GNU=$has_gnu"
            if [ "$has_sysv" -eq 0 ]; then
              echo "❌ libpython3.13.so thiếu DT_HASH"
              FAIL=$((FAIL+1))
            fi
          fi

          for so in "$LIBDYLOAD"/*.so; do
            [ -f "$so" ] || continue
            base=$(basename "$so")
            has_sysv=$(readelf --dynamic "$so" 2>/dev/null | grep -E "\(HASH\)" | grep -v "GNU_HASH" | wc -l)
            has_gnu=$(readelf --dynamic "$so" 2>/dev/null | grep -c "GNU_HASH" || true)
            if [ "$has_sysv" -eq 0 ] || [ "$has_gnu" -eq 0 ]; then
              echo "❌ $base — SysV=$has_sysv GNU=$has_gnu"
              FAIL=$((FAIL+1))
            fi
          done

          if [ "$FAIL" -gt 0 ]; then
            echo ""
            echo "❌ $FAIL file thiếu hash table — Android linker sẽ từ chối"
            exit 1
          fi
          echo "✅ Tất cả extension có DT_HASH + DT_GNU_HASH"

      # [FIX v3] Verify libpython exports critical symbols
      - name: Verify libpython exports critical symbols
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          set -eo pipefail
          LP="$GITHUB_WORKSPACE/python-android/lib/libpython3.13.so"
          if [ ! -f "$LP" ]; then
            echo "❌ $LP không tồn tại"
            exit 1
          fi

          echo "=== Symbol check trên libpython3.13.so ==="
          REQUIRED_SYMS=(
            PyLong_Type PyUnicode_Type PyBytes_Type PyDict_Type
            PyTuple_Type PyList_Type PyExc_RuntimeError PyExc_TypeError
            PyExc_ValueError _Py_NoneStruct Py_Initialize Py_Finalize
          )

          FAIL=0
          for sym in "${REQUIRED_SYMS[@]}"; do
            if nm -D "$LP" 2>/dev/null | grep -q " $sym$"; then
              :
            else
              echo "❌ MISSING: $sym"
              FAIL=$((FAIL+1))
            fi
          done

          if [ "$FAIL" -gt 0 ]; then
            echo ""
            echo "❌ libpython3.13.so thiếu $FAIL symbol — dynsym bị hỏng"
            echo "   Tổng dynsym: $(nm -D "$LP" 2>/dev/null | wc -l)"
            exit 1
          fi
          echo "✅ Tất cả symbol quan trọng có mặt"
          echo "   Tổng dynsym: $(nm -D "$LP" 2>/dev/null | wc -l)"

      # ---------- SECTION 6: BOOTSTRAP WHEELS ----------
      - name: Bootstrap Pure-Python Wheels
        if: steps.cache-python.outputs.cache-hit != 'true'
        run: |
          TARGET_SITE="$GITHUB_WORKSPACE/python-android/lib/python3.13/site-packages"
          mkdir -p /tmp/wheels "$TARGET_SITE"

          "$HOST_PYTHON" -m pip download \
            yt-dlp certifi setuptools wheel pip mutagen \
            --dest=/tmp/wheels --only-binary=:all: --no-deps

          for whl in /tmp/wheels/*.whl; do
            echo "Extracting: $(basename "$whl")"
            unzip -o -q "$whl" -d "$TARGET_SITE"
          done

          echo "=== site-packages ==="
          ls "$TARGET_SITE" | head -20

          if [ ! -d "$TARGET_SITE/pip" ]; then
            echo "❌ pip MISSING"
            exit 1
          fi
          echo "✅ pip bundled"

          if [ ! -d "$TARGET_SITE/yt_dlp" ]; then
            echo "❌ yt_dlp MISSING"
            exit 1
          fi
          echo "✅ yt_dlp bundled"

      # ============================================================
      # [FIX v3] Strip Binaries — KHÔNG đụng vào libpython3.13.so
      # ============================================================
      - name: Strip Binaries and Patch Hardcoded Paths
        run: |
          set -eo pipefail

          LP="$GITHUB_WORKSPACE/python-android/lib/libpython3.13.so"

          # Backup libpython trước khi strip bất kỳ thứ gì
          if [ -f "$LP" ]; then
            cp "$LP" "${LP}.preserve"
          fi

          # [FIX] Chỉ strip-debug (giữ .dynsym) cho lib-dynload
          # KHÔNG dùng --strip-unneeded vì có thể phá dynamic symbol table
          find "$GITHUB_WORKSPACE/python-android/lib/python3.13/lib-dynload" \
            -name "*.so*" -exec "$STRIP" --strip-debug {} \; 2>/dev/null || true

          # Binary python3.13 cũng chỉ strip-debug
          "$STRIP" --strip-debug "$GITHUB_WORKSPACE/python-android/bin/python3.13" 2>/dev/null || true

          # Restore libpython nguyên bản
          if [ -f "${LP}.preserve" ]; then
            mv "${LP}.preserve" "$LP"
          fi

          # Verify ngay sau strip
          if [ -f "$LP" ]; then
            SYM_COUNT=$(nm -D "$LP" 2>/dev/null | wc -l || echo 0)
            echo "libpython3.13.so dynsym count: $SYM_COUNT"
            if [ "$SYM_COUNT" -lt 500 ]; then
              echo "❌ libpython có quá ít symbol — có thể bị strip!"
              exit 1
            fi
            if ! nm -D "$LP" 2>/dev/null | grep -q " PyLong_Type$"; then
              echo "❌ PyLong_Type MISSING sau strip"
              exit 1
            fi
            echo "✅ libpython3.13.so vẫn có PyLong_Type"
          fi

          # Patch hardcoded paths
          find "$GITHUB_WORKSPACE/python-android" -type f \
            \( -name "_sysconfigdata*.py" -o -name "*.pc" -o -name "*-config" -o -name "Makefile" \) \
            -exec sed -i "s|$GITHUB_WORKSPACE/python-android|/data/data/com.nam2006.y2mate/files/python|g" {} \;

      # ---------- SECTION 7: COLLECT jniLibs ----------
      - name: Collect and Process Native Libraries
        run: |
          JNI="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          DYNLIB="$GITHUB_WORKSPACE/python-android/lib/python3.13/lib-dynload"
          PY_LIB="$GITHUB_WORKSPACE/python-android/lib"
          mkdir -p "$JNI"

          cp "$PY_LIB/libpython3.13.so" "$JNI/"
          find "$DEPS_INSTALL/lib" -maxdepth 1 -name "*.so*" -exec cp {} "$JNI/" \; 2>/dev/null || true

          for f in "$JNI"/*.so.*; do
            [ -f "$f" ] || continue
            base=$(basename "$f")
            new=$(echo "$base" | sed -E 's/(\.so)\.[0-9]+(\.[0-9]+)*$/\1/')
            [ "$new" = "$base" ] && continue
            mv "$f" "$JNI/$new"
          done

          PATCHED=0
          for so in "$JNI/libpython3.13.so" "$PY_LIB/libpython3.13.so" "$DYNLIB"/*.so; do
            [ -f "$so" ] || continue
            for needed in $(readelf -d "$so" 2>/dev/null | grep NEEDED | sed 's/.*\[\(.*\)\]/\1/'); do
              new_needed=$(echo "$needed" | sed -E 's/(\.so)\.[0-9]+(\.[0-9]+)*$/\1/')
              if [ "$new_needed" != "$needed" ] && [ -f "$JNI/$new_needed" ]; then
                patchelf --replace-needed "$needed" "$new_needed" "$so"
                PATCHED=$((PATCHED+1))
              fi
            done
          done
          echo "Patched $PATCHED NEEDED entries"

          for so in "$JNI/libpython3.13.so" "$JNI/libssl.so" "$JNI/libcrypto.so"; do
            [ -f "$so" ] && patchelf --force-rpath --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done

          for so in "$DYNLIB"/*.so; do
            [ -f "$so" ] && patchelf --force-rpath --set-rpath '$ORIGIN' "$so" 2>/dev/null || true
          done

          SSL_SO=$(ls "$DYNLIB"/_ssl*.so 2>/dev/null | head -1)
          if [ -z "$SSL_SO" ]; then
            echo "CRITICAL: _ssl module missing!"
            exit 1
          fi

          echo "Final jniLibs:"
          ls -lh "$JNI/"

      # ---------- SECTION 8: PACKAGE RUNTIME TAR ----------
      - name: Package Python Runtime into Assets
        run: |
          mkdir -p "$GITHUB_WORKSPACE/app/src/main/assets"

          cp "$GITHUB_WORKSPACE/app/src/main/python/yt_dlp_bridge.py" \
             "$GITHUB_WORKSPACE/app/src/main/assets/yt_dlp_bridge.py"

          cp "$GITHUB_WORKSPACE/app/src/main/python/py_runner.py" \
             "$GITHUB_WORKSPACE/app/src/main/assets/py_runner.py"

          rm -f "$GITHUB_WORKSPACE/app/src/main/assets/python-runtime.tar" \
                "$GITHUB_WORKSPACE/app/src/main/assets/python-runtime.tar.gz"

          cd "$GITHUB_WORKSPACE/python-android"
          tar -cvf "$GITHUB_WORKSPACE/app/src/main/assets/python-runtime.tar" lib/python3.13

          cd "$GITHUB_WORKSPACE"
          SIZE=$(stat -c%s app/src/main/assets/python-runtime.tar)
          SIZE_MB=$((SIZE / 1024 / 1024))
          echo "Runtime tar: ${SIZE_MB} MB ($SIZE bytes)"
          if [ "$SIZE" -lt 5000000 ]; then
            echo "Runtime tar too small"
            exit 1
          fi

          if tar -tf app/src/main/assets/python-runtime.tar | grep -q "site-packages/pip/"; then
            echo "✅ pip in tar"
          else
            echo "❌ pip NOT in tar!"
            exit 1
          fi

      # ---------- SECTION 9: FFMPEG ----------
      - name: Download FFmpeg from Termux
        run: |
          set -e
          FFMPEG_VERSION="8.1.3"
          ARCH="aarch64"
          DEB_URL="https://packages.termux.dev/apt/termux-main/pool/main/f/ffmpeg/ffmpeg_${FFMPEG_VERSION}_${ARCH}.deb"
          wget -q -O ffmpeg.deb "$DEB_URL"
          mkdir -p ffmpeg-extracted
          dpkg-deb -xv ffmpeg.deb ./ffmpeg-extracted

          TERMUX_BIN="./ffmpeg-extracted/data/data/com.termux/files/usr/bin"
          TERMUX_LIB="./ffmpeg-extracted/data/data/com.termux/files/usr/lib"

          mkdir -p app/src/main/assets/ffmpeg/lib
          cp "${TERMUX_BIN}/ffmpeg" app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          if [ -f "${TERMUX_BIN}/ffprobe" ]; then
            cp "${TERMUX_BIN}/ffprobe" app/src/main/jniLibs/arm64-v8a/libffprobe.so
          fi

          find "$TERMUX_LIB" -maxdepth 1 -type f \
            \( -name "libav*.so*" -o -name "libsw*.so*" -o -name "libpostproc*.so*" \) \
            -exec cp {} app/src/main/assets/ffmpeg/lib/ \;

          chmod 755 app/src/main/jniLibs/arm64-v8a/libffmpeg.so

      # ============================================================
      # [FIX v3] Verify libpython + symbols trong jniLibs
      # ============================================================
      - name: Verify libpython in jniLibs
        run: |
          set -eo pipefail
          JNI="$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          ls -lh "$JNI/"

          for lib in libpython3.13.so libssl.so libcrypto.so; do
            if [ ! -f "$JNI/$lib" ]; then
              echo "❌ $lib MISSING"
              exit 1
            fi
          done
          echo "✅ All required libs present"

          LP="$JNI/libpython3.13.so"

          # DT_HASH check
          has_sysv=$(readelf --dynamic "$LP" 2>/dev/null | grep -E "\(HASH\)" | grep -v "GNU_HASH" | wc -l)
          if [ "$has_sysv" -eq 0 ]; then
            echo "❌ $LP thiếu DT_HASH"
            exit 1
          fi
          echo "✅ DT_HASH OK"

          # [FIX v3] Symbol check — cryptography cần
          REQUIRED_SYMS=(
            PyLong_Type PyUnicode_Type PyBytes_Type PyDict_Type
            PyTuple_Type PyList_Type PyExc_RuntimeError PyExc_TypeError
            PyExc_ValueError _Py_NoneStruct
          )

          SYM_FAIL=0
          for sym in "${REQUIRED_SYMS[@]}"; do
            if ! nm -D "$LP" 2>/dev/null | grep -q " $sym$"; then
              echo "❌ MISSING: $sym"
              SYM_FAIL=$((SYM_FAIL+1))
            fi
          done

          if [ "$SYM_FAIL" -gt 0 ]; then
            echo ""
            echo "❌ $SYM_FAIL symbol thiếu trong libpython3.13.so"
            echo "   → cryptography _rust.abi3.so sẽ KHÔNG load được"
            echo "   Tổng dynsym: $(nm -D "$LP" 2>/dev/null | wc -l)"
            exit 1
          fi
          echo "✅ Tất cả symbol quan trọng có mặt"
          echo "   Tổng dynsym: $(nm -D "$LP" 2>/dev/null | wc -l)"

      # ---------- SECTION 10: BUILD APK ----------
      - name: Setup debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -f "debug.keystore" ]; then
            cp debug.keystore "$HOME/.android/debug.keystore"
          else
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          VERSION=${{ steps.bump.outputs.new_version }}
          for f in app/build/outputs/apk/release/*.apk; do
            if [[ "$f" != *".apk" ]] || [[ "$f" == *"-unaligned"* ]]; then continue; fi
            DIR=$(dirname "$f")
            BASE=$(basename "$f" .apk)
            mv "$f" "${DIR}/${BASE}-v${VERSION}.apk"
          done
          ls -la app/build/outputs/apk/release/

      - name: Report final sizes
        run: |
          echo "APK:"
          ls -lh app/build/outputs/apk/release/*.apk
          echo ""
          du -sh app/src/main/jniLibs/arm64-v8a/ 2>/dev/null || true
          du -sh app/src/main/assets/ 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: Mini-Y2mate-Pro-v${{ steps.bump.outputs.new_version }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30

  # ============================================================
  # JOB 2: Build Plugin Repository
  # ============================================================
  build-plugin:
    needs: changes
    if: needs.changes.outputs.plugin == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Bump plugin version code
        id: bump
        run: |
          set -e
          F="plugin/versioncode.txt"
          if [ -f "$F" ]; then
            C=$(cat "$F" | tr -d '[:space:]')
            C=${C:-0}
          else
            C=0
          fi
          if ! [[ "$C" =~ ^[0-9]+$ ]]; then C=0; fi
          N=$((C + 1))
          echo "$N" > "$F"
          echo "new_version=$N" >> "$GITHUB_OUTPUT"

      - name: Commit plugin version bump
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/versioncode.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore(plugin): bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
            for i in 1 2 3 4 5; do
              if git pull --rebase origin "${{ github.ref_name }}" && git push origin "HEAD:${{ github.ref_name }}"; then
                break
              fi
              sleep 5
            done
          fi

      - name: Setup debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -f "debug.keystore" ]; then
            cp debug.keystore "$HOME/.android/debug.keystore"
          else
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build plugin APK
        run: gradle :plugin:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          V="${{ steps.bump.outputs.new_version }}"
          for f in plugin/build/outputs/apk/release/*.apk; do
            if [[ "$f" != *".apk" ]] || [[ "$f" == *"-unaligned"* ]]; then continue; fi
            D=$(dirname "$f")
            B=$(basename "$f" .apk)
            mv "$f" "${D}/${B}-v${V}.apk"
          done
          ls -lh plugin/build/outputs/apk/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-v1.0.${{ steps.bump.outputs.new_version }}
          name: Mini-Y2mate Repository v1.0.${{ steps.bump.outputs.new_version }}
          body: |
            Plugin Repository cho Mini-Y2mate.
            Cung cấp pip index để tải wheel Android có sẵn.
          files: plugin/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: Mini-Y2mate-Repo-v${{ steps.bump.outputs.new_version }}
          path: plugin/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30