name: Build Android Wheels

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages (cách nhau bằng dấu cách)'
        required: false
        default: ''
      force_rebuild:
        description: 'Force rebuild — true/false'
        required: false
        default: 'false'
      clean_old_releases:
        description: 'Xóa release wheels cũ (giữ 3 gần nhất)'
        required: false
        default: 'false'
  push:
    branches:
      - main
      - nam348tnh3gp-patch-1
    paths:
      - 'wheels/list.txt'
      - 'scripts/**'
      - 'recipes/**'
      - 'Dockerfile.wheels'
      - '.github/workflows/build-wheels.yml'

concurrency:
  group: build-wheels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  # ════════════════════════════════════════════════════════════
  # Matrix: build cho từng phiên bản Python
  # ════════════════════════════════════════════════════════════
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - python_version: '3.13.1'
            python_minor: '3.13'
          - python_version: '3.14.0rc2'
            python_minor: '3.14'
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk \
                      /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1

      - name: Cache deps-install
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/deps-install
          key: deps-aarch64-api24-v7
          restore-keys: |
            deps-aarch64-api24-

      - name: Cache python-android
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/python-android
          key: python-android-${{ matrix.python_minor }}-v17-docker-${{ hashFiles('Dockerfile.wheels') }}
          restore-keys: |
            python-android-${{ matrix.python_minor }}-v17-docker-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build wheel-builder image (py${{ matrix.python_minor }})
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.wheels
          load: true
          tags: p4a-wheels:py${{ matrix.python_minor }}
          build-args: |
            PYTHON_VERSION=${{ matrix.python_version }}
            PYTHON_MINOR=${{ matrix.python_minor }}
          cache-from: type=gha,scope=v5-py${{ matrix.python_minor }}
          cache-to: type=gha,mode=max,scope=v5-py${{ matrix.python_minor }}

      - name: Prepare workspace dirs
        run: |
          mkdir -p deps-install python-android wheels-out wheels-final docs
          sudo chown -R 1000:1000 "${{ github.workspace }}"
          ls -la "${{ github.workspace }}"

      - name: Run build in container (py${{ matrix.python_minor }})
        run: |
          set -e
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -u 1000:1000 \
            -e PYTHON_VERSION=${{ matrix.python_version }} \
            -e PYTHON_MINOR=${{ matrix.python_minor }} \
            -e INPUT_PACKAGES="${{ github.event.inputs.packages }}" \
            -e INPUT_FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}" \
            -e INPUT_CLEAN_OLD="${{ github.event.inputs.clean_old_releases }}" \
            p4a-wheels:py${{ matrix.python_minor }} \
            bash /work/scripts/entrypoint.sh

      - name: Fix ownership back
        if: always()
        run: sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}" || true

      - name: Add summary to job summary
        if: always()
        run: |
          {
            echo "## 📦 Build Summary — py${{ matrix.python_minor }}"
            echo ""
            if [ -f build-summary.txt ]; then
              echo '```'
              cat build-summary.txt
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload wheels artifact
        if: hashFiles('wheels-final/*.whl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wheels-py${{ matrix.python_minor }}
          path: wheels-final/*.whl
          retention-days: 30

      - name: Upload failures (if any)
        if: always() && hashFiles('build-failures.txt') != ''
        uses: actions/upload-artifact@v4
        with:
          name: failures-py${{ matrix.python_minor }}-${{ github.run_id }}
          path: |
            build-failures.txt
            build-summary.txt
          retention-days: 30

  # ════════════════════════════════════════════════════════════
  # Release — gộp wheels từ 2 phiên bản
  # ════════════════════════════════════════════════════════════
  release:
    needs: build
    runs-on: ubuntu-latest
    if: needs.build.result == 'success'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Download all wheels
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-py*
          merge-multiple: true
          path: wheels-final

      - name: List wheels
        run: |
          echo "=== WHEELS ==="
          ls -lh wheels-final/ || true
          echo "Total: $(ls wheels-final/*.whl 2>/dev/null | wc -l)"

      - name: Verify wheels
        env:
          WHEELS_FINAL: ${{ github.workspace }}/wheels-final
          READELF: readelf
        run: |
          chmod +x scripts/verify-wheels.sh
          bash scripts/verify-wheels.sh

      - name: Cleanup old releases (optional)
        if: github.event.inputs.clean_old_releases == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release list --limit 100 --json tagName \
            -q '.[] | select(.tagName | startswith("wheels-")) | .tagName' > /tmp/all_tags.txt
          TOTAL=$(wc -l < /tmp/all_tags.txt)
          if [ "$TOTAL" -le 3 ]; then exit 0; fi
          tail -n +4 /tmp/all_tags.txt | while read -r tag; do
            [ -z "$tag" ] && continue
            gh release delete "$tag" --yes --cleanup-tag 2>&1 || true
          done

      - name: Generate release tag
        id: tag
        run: |
          TAG="wheels-$(date +%Y%m%d-%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "→ TAG=$TAG"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Wheels ${{ steps.tag.outputs.tag }}
          body: |
            Android aarch64 wheels cho **Python 3.13 & 3.14**.

            Bao gồm: `cp313-cp313-android_24_arm64_v8a` và `cp314-cp314-android_24_arm64_v8a`.

            Pip index: `pip install --extra-index-url https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/simple/ <pkg>`
          files: wheels-final/*.whl
          generate_release_notes: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pip index
        run: |
          python3 scripts/gen_index.py \
            wheels-final docs \
            ${{ github.repository_owner }} \
            ${{ github.event.repository.name }} \
            ${{ steps.tag.outputs.tag }}

      - name: Create docs/index.html if missing
        run: |
          if [ ! -f docs/index.html ]; then
            cat > docs/index.html <<'EOF'
          <!DOCTYPE html>
          <html>
          <head>
            <meta charset="utf-8">
            <meta http-equiv="refresh" content="0; url=./simple/">
            <title>Python Package Index</title>
          </head>
          <body>
            <h1>Python Package Index</h1>
            <p>Đang chuyển hướng tới <a href="./simple/">simple index</a>...</p>
          </body>
          </html>
          EOF
          fi

      - name: Commit docs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no change in docs/"
            exit 0
          fi
          git commit -m "chore(wheels): update index [${{ steps.tag.outputs.tag }}] [skip ci]"
          git checkout -- . 2>/dev/null || true
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd -x -e wheels-final 2>/dev/null || true
          for i in 1 2 3 4 5; do
            echo "=== Attempt $i ==="
            if git pull --rebase origin "${{ github.ref_name }}" && \
               git push origin "HEAD:${{ github.ref_name }}"; then
              echo "✅ Push OK"
              exit 0
            fi
            sleep 5
          done
          echo "❌ Push thất bại"
          exit 1