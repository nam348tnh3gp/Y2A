name: Build Android Wheels

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages (cách nhau bằng dấu cách)'
        required: false
        default: ''
      force_rebuild:
        description: 'Force rebuild — true/false'
        required: false
        default: 'false'
      clean_old_releases:
        description: 'Xóa release wheels cũ (giữ 3 gần nhất) — true/false'
        required: false
        default: 'false'
  push:
    branches:
      - main
      - nam348tnh3gp-patch-1
    paths:
      - 'wheels/list.txt'
      - 'scripts/**'
      - 'Dockerfile.wheels'
      - '.github/workflows/build-wheels.yml'

concurrency:
  group: build-wheels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk \
                      /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1

      # ============================================================
      # [CACHE] deps-install (cross-compiled deps)
      # ============================================================
      - name: Cache deps-install
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/deps-install
          key: deps-aarch64-api24-v6-docker
          restore-keys: |
            deps-aarch64-api24-

      # ============================================================
      # [CACHE] python-android (cross-compiled CPython)
      # ============================================================
      - name: Cache python-android
        id: cache-python
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/python-android
          key: python-android-3.13.1-v13-docker-${{ hashFiles('Dockerfile.wheels') }}
          restore-keys: |
            python-android-3.13.1-v13-docker-

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ============================================================
      # Build Docker image (cached layers)
      # ============================================================
      - name: Build wheel-builder image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.wheels
          load: true
          tags: p4a-wheels:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ============================================================
      # Prepare workspace dirs + fix ownership
      # ============================================================
      - name: Prepare workspace dirs
        run: |
          mkdir -p deps-install python-android wheels-out wheels-final docs
          # [FIX] Chown workspace to match container user (uid 1000)
          sudo chown -R 1000:1000 "${{ github.workspace }}"
          ls -la "${{ github.workspace }}"

      # ============================================================
      # Run build in container
      # ============================================================
      - name: Run build in container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -u 1000:1000 \
            -e GH_TOKEN \
            -e INPUT_PACKAGES="${{ github.event.inputs.packages }}" \
            -e INPUT_FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}" \
            -e INPUT_CLEAN_OLD="${{ github.event.inputs.clean_old_releases }}" \
            -e REF_NAME="${{ github.ref_name }}" \
            -e GITHUB_REPO_OWNER="${{ github.repository_owner }}" \
            -e GITHUB_REPO_NAME="${{ github.event.repository.name }}" \
            p4a-wheels:latest \
            bash /work/scripts/entrypoint.sh

      # ============================================================
      # Fix ownership back (để upload-artifact đọc được)
      # ============================================================
      - name: Fix ownership back
        if: always()
        run: sudo chown -R $(id -u):$(id -g) "${{ github.workspace }}" || true

      - uses: actions/upload-artifact@v4
        if: hashFiles('wheels-final/*.whl') != ''
        with:
          name: wheels-${{ github.run_id }}
          path: wheels-final/*.whl
          retention-days: 30