name: Build Android Wheels

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages (cách nhau bằng dấu cách)'
        required: false
        default: ''
      force_rebuild:
        description: 'Force rebuild — true/false'
        required: false
        default: 'false'
      clean_old_releases:
        description: 'Xóa release wheels cũ (giữ 3 gần nhất) — true/false'
        required: false
        default: 'false'
  push:
    branches:
      - main
      - nam348tnh3gp-patch-1
    paths:
      - 'wheels/list.txt'
      - 'scripts/gen_index.py'
      - 'scripts/build-p4a-style.sh'
      - '.github/workflows/build-wheels.yml'

concurrency:
  group: build-wheels
  cancel-in-progress: false

permissions:
  contents: write

env:
  # [FIX] PYTHON_MINOR dùng chung, tránh hardcode python3.13
  PYTHON_VERSION: "3.13.1"
  PYTHON_MINOR: "3.13"
  OPENSSL_VERSION: "3.3.2"
  LIBFFI_VERSION: "3.4.6"
  SQLITE_VERSION: "3460100"
  SQLITE_YEAR: "2024"
  XZ_VERSION: "5.4.6"
  ZLIB_VERSION: "1.3.1"
  LIBXML2_VERSION: "2.12.6"
  LIBXSLT_VERSION: "1.1.39"
  LIBJPEGTURBO_VERSION: "3.0.3"
  LIBPNG_VERSION: "1.6.43"
  OPENBLAS_VERSION: "0.3.28"
  ANDROID_API: "24"
  TARGET_HOST: "aarch64-linux-android"
  ANDROID_TAG: "android_24_arm64_v8a"   # [FIX] tag chuẩn PEP 738
  MAKEFLAGS: "-j2"                       # [FIX] tránh OOM
  # [FIX] Prefix target — không hardcode /data/data/com.nam2006.y2mate
  ANDROID_APP_PREFIX: "/data/data/com.nam2006.y2mate/files"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify p4a script
        run: |
          if [ ! -f scripts/build-p4a-style.sh ]; then
            echo "❌ Missing scripts/build-p4a-style.sh"
            exit 1
          fi
          chmod +x scripts/build-p4a-style.sh
          echo "✅ OK"

      # ============================================================
      # [CACHE] NDK r25c
      # ============================================================
      - name: Cache NDK r25c
        id: cache-ndk
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/ndk-cache
          key: ndk-r25c-${{ runner.os }}-v1
          restore-keys: |
            ndk-r25c-${{ runner.os }}-

      - name: Setup Android NDK r25c
        run: |
          mkdir -p "${{ github.workspace }}/ndk-cache"
          cd "${{ github.workspace }}/ndk-cache"
          if [ ! -d "android-ndk-r25c" ]; then
            wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
            unzip -q android-ndk-r25c-linux.zip
            rm -f android-ndk-r25c-linux.zip
          fi
          echo "NDK=${{ github.workspace }}/ndk-cache/android-ndk-r25c" >> "$GITHUB_ENV"
          echo "${{ github.workspace }}/ndk-cache/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # ============================================================
      # [CACHE] Host Python 3.13.1
      # ============================================================
      - name: Cache Host Python
        id: cache-host-python
        uses: actions/cache@v4
        with:
          path: /tmp/host-python
          key: host-python-${{ env.PYTHON_VERSION }}-${{ runner.os }}-v1
          restore-keys: |
            host-python-${{ env.PYTHON_VERSION }}-

      - name: Build Host Python
        if: steps.cache-host-python.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/build-host
          cd /tmp/build-host
          wget -q "https://www.python.org/ftp/python/${{ env.PYTHON_VERSION }}/Python-${{ env.PYTHON_VERSION }}.tar.xz"
          tar -xf "Python-${{ env.PYTHON_VERSION }}.tar.xz"
          cd "Python-${{ env.PYTHON_VERSION }}"
          # [FIX] --disable-optimizations thay vì --enable-optimizations=no
          ./configure --prefix=/tmp/host-python --disable-optimizations
          make
          make install
          ls -lh /tmp/host-python/bin/python*

      - name: Set Host Python env
        run: |
          echo "HOST_PYTHON=/tmp/host-python/bin/python${PYTHON_MINOR}" >> "$GITHUB_ENV"

      - name: Install Host Tools
        run: |
          sudo sed -i 's|http://azure.archive.ubuntu.com|http://archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list 2>/dev/null || true
          sudo sed -i 's|https://azure.archive.ubuntu.com|https://archive.ubuntu.com|g' \
            /etc/apt/sources.list.d/*.list /etc/apt/sources.list 2>/dev/null || true
          sudo apt-get update \
            -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 \
            -o Acquire::Retries=1 -o Acquire::ForceIPv4=true -qq || true
          sudo apt-get install -y --no-install-recommends \
            build-essential autoconf automake libtool \
            pkg-config wget curl unzip git xz-utils python3 python3-pip patchelf \
            cmake ninja-build nasm

      # ============================================================
      # Cleanup releases cũ
      # ============================================================
      - name: Cleanup old wheel releases
        if: github.event.inputs.clean_old_releases == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== Danh sách releases wheels ==="
          gh release list --limit 100 --json tagName -q '.[] | select(.tagName | startswith("wheels-")) | .tagName' > /tmp/all_tags.txt
          cat /tmp/all_tags.txt
          TOTAL=$(wc -l < /tmp/all_tags.txt)
          echo "Tổng: $TOTAL release"
          if [ "$TOTAL" -le 3 ]; then
            echo "≤ 3 release — không cần xóa"
            exit 0
          fi
          KEEP=$(head -3 /tmp/all_tags.txt)
          DELETE=$(tail -n +4 /tmp/all_tags.txt)
          echo "=== Giữ lại ==="; echo "$KEEP"
          echo "=== Xóa ==="; echo "$DELETE"
          while read -r tag; do
            [ -z "$tag" ] && continue
            echo "→ Xóa release: $tag"
            gh release delete "$tag" --yes --cleanup-tag 2>&1 || true
          done <<< "$DELETE"
          echo "✅ Cleanup done"

      # ============================================================
      # Tải wheel từ release gần nhất
      # ============================================================
      - name: Download previous wheels
        id: prev
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild }}
        run: |
          set -eo pipefail
          mkdir -p wheels-out
          if [ "$FORCE_REBUILD" = "true" ]; then
            echo "⚡ force_rebuild"
            echo "has_cache=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          LATEST_TAG=$(gh release list --limit 50 --json tagName -q '.[] | select(.tagName | startswith("wheels-")) | .tagName' | head -1 || echo "")
          if [ -z "$LATEST_TAG" ]; then
            echo "has_cache=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "Tag: $LATEST_TAG"
          gh release download "$LATEST_TAG" --pattern '*.whl' --dir wheels-out --clobber 2>&1 | tail -3 || true
          COUNT=$(ls wheels-out/*.whl 2>/dev/null | wc -l)
          echo "$COUNT wheel"
          [ "$COUNT" -gt 0 ] && echo "has_cache=true" >> "$GITHUB_OUTPUT" || echo "has_cache=false" >> "$GITHUB_OUTPUT"

      # ============================================================
      # [CACHE] Cross-compile deps
      # ============================================================
      - name: Cache cross-compile deps
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/deps-install
          key: deps-${{ env.TARGET_HOST }}-api${{ env.ANDROID_API }}-v1
          restore-keys: |
            deps-${{ env.TARGET_HOST }}-api${{ env.ANDROID_API }}-

      - name: Export Cross-Compile Environment
        run: |
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          DEPS_INSTALL="$GITHUB_WORKSPACE/deps-install"
          mkdir -p "$DEPS_INSTALL"

          echo "CC=$TOOLCHAIN/bin/${{ env.TARGET_HOST }}${{ env.ANDROID_API }}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/${{ env.TARGET_HOST }}${{ env.ANDROID_API }}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "READELF=$TOOLCHAIN/bin/llvm-readelf" >> "$GITHUB_ENV"
          echo "DEPS_INSTALL=$DEPS_INSTALL" >> "$GITHUB_ENV"
          # [FIX] PKG_CONFIG_SYSROOT_DIR rỗng — tránh double-prefix
          echo "PKG_CONFIG_LIBDIR=$DEPS_INSTALL/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$DEPS_INSTALL/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=" >> "$GITHUB_ENV"
          echo "CFLAGS=-fPIC -O2 -I$DEPS_INSTALL/include -Wno-implicit-function-declaration" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$DEPS_INSTALL/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$DEPS_INSTALL/lib -Wl,--hash-style=both" >> "$GITHUB_ENV"

      # ─────────── CROSS-COMPILE CORE DEPS ───────────

      - name: Cross-Compile libffi
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://github.com/libffi/libffi/releases/download/v${{ env.LIBFFI_VERSION }}/libffi-${{ env.LIBFFI_VERSION }}.tar.gz"
          tar -xf "libffi-${{ env.LIBFFI_VERSION }}.tar.gz"
          cd "libffi-${{ env.LIBFFI_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" --enable-static --disable-shared
          make install

      - name: Cross-Compile OpenSSL
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION }}/openssl-${{ env.OPENSSL_VERSION }}.tar.gz" \
            || wget -q "https://www.openssl.org/source/openssl-${{ env.OPENSSL_VERSION }}.tar.gz"
          tar -xf "openssl-${{ env.OPENSSL_VERSION }}.tar.gz"
          cd "openssl-${{ env.OPENSSL_VERSION }}"
          export ANDROID_NDK_ROOT="$NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          # [FIX] -Wl,--hash-style=both vào LDFLAGS, không để bare arg
          LDFLAGS="-Wl,--hash-style=both" \
          ./Configure android-arm64 -D__ANDROID_API__=${{ env.ANDROID_API }} \
            --prefix="$DEPS_INSTALL" --openssldir="$DEPS_INSTALL/ssl" \
            shared no-engine no-tests no-async \
            CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" STRIP="$STRIP"
          make
          make install_sw

      - name: Cross-Compile SQLite3
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          SQLITE_URL="https://www.sqlite.org/${{ env.SQLITE_YEAR }}/sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz"
          if ! curl --output /dev/null --silent --head --fail "$SQLITE_URL"; then
            SQLITE_URL="https://www.sqlite.org/2023/sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz"
          fi
          wget -q "$SQLITE_URL"
          tar -xf "sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz"
          cd "sqlite-autoconf-${{ env.SQLITE_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" --enable-static --disable-shared
          make install

      - name: Cross-Compile XZ
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://github.com/tukaani-project/xz/releases/download/v${{ env.XZ_VERSION }}/xz-${{ env.XZ_VERSION }}.tar.gz"
          tar -xf "xz-${{ env.XZ_VERSION }}.tar.gz"
          cd "xz-${{ env.XZ_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" --enable-static --disable-shared
          make install

      - name: Cross-Compile zlib
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://github.com/madler/zlib/releases/download/v${{ env.ZLIB_VERSION }}/zlib-${{ env.ZLIB_VERSION }}.tar.gz"
          tar -xf "zlib-${{ env.ZLIB_VERSION }}.tar.gz"
          cd "zlib-${{ env.ZLIB_VERSION }}"
          CC="$CC" AR="$AR" RANLIB="$RANLIB" ./configure --prefix="$DEPS_INSTALL" --static
          make install

      - name: Cross-Compile libxml2
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://download.gnome.org/sources/libxml2/2.12/libxml2-${{ env.LIBXML2_VERSION }}.tar.xz"
          tar -xf "libxml2-${{ env.LIBXML2_VERSION }}.tar.xz"
          cd "libxml2-${{ env.LIBXML2_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" \
            --enable-static --disable-shared --without-python --without-lzma --without-zlib --without-iconv --without-icu
          make install

      - name: Cross-Compile libxslt
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://download.gnome.org/sources/libxslt/1.1/libxslt-${{ env.LIBXSLT_VERSION }}.tar.xz"
          tar -xf "libxslt-${{ env.LIBXSLT_VERSION }}.tar.xz"
          cd "libxslt-${{ env.LIBXSLT_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" \
            --enable-static --disable-shared --without-python --without-crypto
          make install

      - name: Cross-Compile libjpeg-turbo
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${{ env.LIBJPEGTURBO_VERSION }}/libjpeg-turbo-${{ env.LIBJPEGTURBO_VERSION }}.tar.gz"
          tar -xf "libjpeg-turbo-${{ env.LIBJPEGTURBO_VERSION }}.tar.gz"
          cd "libjpeg-turbo-${{ env.LIBJPEGTURBO_VERSION }}"
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DCMAKE_INSTALL_PREFIX="$DEPS_INSTALL" \
            -DENABLE_SHARED=OFF -DENABLE_STATIC=ON -DWITH_TURBOJPEG=OFF -DWITH_SIMD=OFF ..
          ninja && ninja install

      - name: Cross-Compile libpng
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://download.sourceforge.net/libpng/libpng-${{ env.LIBPNG_VERSION }}.tar.gz" \
            || wget -q "https://github.com/pnggroup/libpng/archive/refs/tags/v${{ env.LIBPNG_VERSION }}.tar.gz" -O "libpng-${{ env.LIBPNG_VERSION }}.tar.gz"
          tar -xf "libpng-${{ env.LIBPNG_VERSION }}.tar.gz"
          cd "libpng-${{ env.LIBPNG_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" --enable-static --disable-shared
          make install

      - name: Cross-Compile OpenBLAS
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: |
          cd /tmp
          wget -q "https://github.com/OpenMathLib/OpenBLAS/releases/download/v${{ env.OPENBLAS_VERSION }}/OpenBLAS-${{ env.OPENBLAS_VERSION }}.tar.gz"
          tar -xf "OpenBLAS-${{ env.OPENBLAS_VERSION }}.tar.gz"
          cd "OpenBLAS-${{ env.OPENBLAS_VERSION }}"
          MAKE_VARS=(
            "TARGET=ARMV8" "HOSTCC=gcc"
            "CC=$CC" "CXX=$CXX" "AR=$AR" "RANLIB=$RANLIB"
            "FC=" "NOFORTRAN=1" "NOLAPACK=0"
            "USE_THREAD=1" "USE_OPENMP=0" "NUM_THREADS=64"
            "COMMON_OPT=-O2 -fPIC" "CFLAGS=-O2 -fPIC -I$DEPS_INSTALL/include"
          )
          make "${MAKE_VARS[@]}"
          make "${MAKE_VARS[@]}" PREFIX="$DEPS_INSTALL" install

      # ─────────── CROSS-COMPILE CPYTHON ───────────

      - name: Cross-Compile CPython
        run: |
          cd /tmp
          tar -xf "/tmp/build-host/Python-${{ env.PYTHON_VERSION }}.tar.xz"
          cd "Python-${{ env.PYTHON_VERSION }}"
          printf '%s\n' '*disabled*' '_crypt' '_nis' 'spwd' 'ossaudiodev' \
            '_curses' '_curses_panel' 'readline' '_multiprocessing' 'nis' > Modules/Setup.local
          LDFLAGS="-L$DEPS_INSTALL/lib -Wl,--hash-style=both" \
          OPENSSL_CFLAGS="-I$DEPS_INSTALL/include" OPENSSL_LIBS="-L$DEPS_INSTALL/lib -lssl -lcrypto" \
          LIBFFI_CFLAGS="-I$DEPS_INSTALL/include" LIBFFI_LIBS="-L$DEPS_INSTALL/lib -lffi" \
          SQLITE3_CFLAGS="-I$DEPS_INSTALL/include" SQLITE3_LIBS="-L$DEPS_INSTALL/lib -lsqlite3" \
          LZMA_CFLAGS="-I$DEPS_INSTALL/include" LZMA_LIBS="-L$DEPS_INSTALL/lib -llzma" \
          ./configure \
            --host="${{ env.TARGET_HOST }}" --build=x86_64-pc-linux-gnu \
            --prefix="$GITHUB_WORKSPACE/python-android" \
            --with-build-python="$HOST_PYTHON" \
            --enable-shared --disable-ipv6 --without-ensurepip \
            --with-openssl="$DEPS_INSTALL" \
            ac_cv_file__dev_ptmx=no ac_cv_file__dev_ptc=no \
            ac_cv_buggy_getaddrinfo=no ac_cv_little_endian_double=yes
          make
          make install

      - name: Symlink target Python path
        run: |
          # [FIX] Dùng ANDROID_APP_PREFIX thay vì hardcode
          sudo mkdir -p "$ANDROID_APP_PREFIX"
          sudo ln -sfn "$GITHUB_WORKSPACE/python-android" "$ANDROID_APP_PREFIX/python"

      - name: Prepare pip
        run: |
          SITE="$GITHUB_WORKSPACE/python-android/lib/python${PYTHON_MINOR}/site-packages"
          mkdir -p "$SITE"
          # [FIX] pip install --target thay vì unzip wheel thủ công
          "$HOST_PYTHON" -m pip install \
            --target="$SITE" --no-deps --no-cache-dir --only-binary=:all: \
            pip setuptools wheel

      - name: Install build dependencies
        run: |
          SITE="$GITHUB_WORKSPACE/python-android/lib/python${PYTHON_MINOR}/site-packages"
          mkdir -p "$SITE"
          "$HOST_PYTHON" -m pip install \
            --target="$SITE" \
            --no-deps --no-cache-dir --only-binary=:all: --upgrade \
            "setuptools_scm<8.2" pybind11 maturin meson-python meson ninja \
            pkgconfig Cython expandvars packaging tomli \
            poetry-core flit-core hatchling wheel setuptools-rust
          # [FIX] cài cho host để build system import được
          "$HOST_PYTHON" -m pip install --no-cache-dir \
            meson-python meson ninja maturin pybind11 setuptools-rust \
            "setuptools_scm<8.2" Cython expandvars pkgconfig cffi \
            scikit-build-core poetry-core flit-core hatchling

      - name: Read package list
        id: pkglist
        env:
          # [FIX] Truyền input qua env — tránh command injection
          INPUT_PACKAGES: ${{ github.event.inputs.packages }}
        run: |
          if [ -n "$INPUT_PACKAGES" ]; then
            LIST="$INPUT_PACKAGES"
          else
            LIST=$(grep -v '^#' wheels/list.txt | grep -v '^$' | tr '\n' ' ')
          fi
          CLEAN=""
          for p in $LIST; do
            if echo "$p" | grep -qE '^[a-zA-Z][a-zA-Z0-9_.\-]*$'; then
              CLEAN="$CLEAN $p"
            fi
          done
          CLEAN=$(echo "$CLEAN" | xargs)
          echo "packages=$CLEAN" >> "$GITHUB_OUTPUT"
          echo "📦 $CLEAN"

      # ============================================================
      # [CACHE] Rust
      # ============================================================
      - name: Cache Rust
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            ~/.rustup/
          key: rust-${{ runner.os }}-v1
          restore-keys: |
            rust-${{ runner.os }}-

      - name: Setup Rust
        env:
          CC_VAL: ${{ env.CC }}
          AR_VAL: ${{ env.AR }}
        run: |
          if [ ! -f "$HOME/.cargo/bin/rustup" ]; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
              sh -s -- -y --default-toolchain stable --profile minimal
          fi
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android
          mkdir -p "$HOME/.cargo"
          # [FIX] heredoc quoted, không thụt lề
          cat > "$HOME/.cargo/config.toml" <<EOF
          [target.aarch64-linux-android]
          linker = "${CC_VAL}"
          ar = "${AR_VAL}"
          EOF
          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$GITHUB_ENV"

      # ==========================================================
      # BUILD WHEELS
      # ==========================================================
      - name: Build wheels
        env:
          PKGLIST: ${{ steps.pkglist.outputs.packages }}
        run: |
          set -eo pipefail
          HOST_PY="$HOST_PYTHON"
          TARGET_ROOT="$GITHUB_WORKSPACE/python-android"
          TARGET_STDLIB="$TARGET_ROOT/lib/python${PYTHON_MINOR}"
          TARGET_SITE="$TARGET_STDLIB/site-packages"
          mkdir -p wheels-out

          SYSCONF_FILE=$(ls "$TARGET_STDLIB"/_sysconfigdata__*.py 2>/dev/null | head -1)
          if [ -z "$SYSCONF_FILE" ]; then
            echo "❌ Không có _sysconfigdata"
            exit 1
          fi
          SYSCONF_NAME=$(basename "$SYSCONF_FILE" .py)
          echo "✅ Sysconfig: $SYSCONF_NAME"

          SYSCONF_DIR="$GITHUB_WORKSPACE/sysconfigdata-host"
          rm -rf "$SYSCONF_DIR" && mkdir -p "$SYSCONF_DIR"
          cp "$SYSCONF_FILE" "$SYSCONF_DIR/"

          HOST_INCLUDE="/tmp/host-python/include/python${PYTHON_MINOR}"
          TARGET_INCLUDE="$TARGET_ROOT/include/python${PYTHON_MINOR}"
          if [ -d "$TARGET_INCLUDE" ]; then
            cp -rf "$TARGET_INCLUDE/." "$HOST_INCLUDE/"
          fi

          mkdir -p "$DEPS_INSTALL/lib"
          if [ ! -f "$DEPS_INSTALL/lib/librt.a" ]; then
            ar rcs "$DEPS_INSTALL/lib/librt.a"
          fi

          NDK_SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          NDK_PREBUILT="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          CLANG_BUILTIN=$("$CC" -print-resource-dir 2>/dev/null)/include
          if [ ! -f "$CLANG_BUILTIN/stddef.h" ]; then
            CLANG_BUILTIN=$(find "$NDK_PREBUILT" -type f -name "stddef.h" 2>/dev/null | head -1 | xargs -r dirname)
          fi
          echo "CLANG_BUILTIN: ${CLANG_BUILTIN:-NOT_FOUND}"

          export NDK_SYSROOT CLANG_BUILTIN
          # [FIX] Tag Android đúng chuẩn ngay từ đầu (dấu gạch dưới)
          export _PYTHON_HOST_PLATFORM="linux_aarch64"
          export _PYTHON_PROJECT_BASE="$TARGET_ROOT"
          export _PYTHON_SYSCONFIGDATA_NAME="$SYSCONF_NAME"
          export PYTHONPATH="$SYSCONF_DIR:$TARGET_SITE"
          export PATH="$TARGET_SITE/bin:/tmp/host-python/bin:$HOME/.cargo/bin:$PATH"
          export CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB"
          export STRIP="$STRIP" LDSHARED="$CC -shared" CPP="$CC -E" READELF="$READELF"

          export CFLAGS="-fPIC -O2 \
            -nostdinc \
            -I$CLANG_BUILTIN \
            -I$NDK_SYSROOT/usr/include \
            -I$NDK_SYSROOT/usr/include/aarch64-linux-android \
            -I$DEPS_INSTALL/include \
            -I$TARGET_ROOT/include/python${PYTHON_MINOR} \
            -Wno-implicit-function-declaration"
          export CPPFLAGS="$CFLAGS"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-L$DEPS_INSTALL/lib -L$NDK_SYSROOT/usr/lib/aarch64-linux-android/${{ env.ANDROID_API }} -Wl,--hash-style=both"

          export PKG_CONFIG_PATH="$DEPS_INSTALL/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS_INSTALL/lib/pkgconfig"
          # [FIX] Không set PKG_CONFIG_SYSROOT_DIR

          export PYO3_PYTHON="$HOST_PY"
          export PYO3_CROSS=1
          export PYO3_CROSS_PYTHON_VERSION="${{ env.PYTHON_MINOR }}"
          export PYO3_CROSS_LIB_DIR="$TARGET_ROOT/lib"
          export PYO3_CROSS_INCLUDE_DIR="$TARGET_ROOT/include"

          export CARGO_BUILD_TARGET="aarch64-linux-android"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_RUSTFLAGS="-C link-arg=-L$DEPS_INSTALL/lib"
          export OPENSSL_DIR="$DEPS_INSTALL"
          export OPENSSL_LIB_DIR="$DEPS_INSTALL/lib"
          export OPENSSL_INCLUDE_DIR="$DEPS_INSTALL/include"

          export HOST_PY TARGET_ROOT TARGET_SITE TARGET_STDLIB
          export WHEELS_OUT="$GITHUB_WORKSPACE/wheels-out"

          # [FIX] wheel_exists dùng compgen
          wheel_exists() {
            local pkg="$1"
            local pkg_a pkg_b
            pkg_a=$(echo "$pkg" | tr '[:upper:]' '[:lower:]' | tr '-' '_')
            pkg_b=$(echo "$pkg" | tr '[:upper:]' '[:lower:]' | tr '_' '-')
            compgen -G "wheels-out/${pkg_a}-*.whl" > /dev/null 2>&1 && return 0
            compgen -G "wheels-out/${pkg_b}-*.whl" > /dev/null 2>&1 && return 0
            return 1
          }

          SUCCESS_T1=""; SUCCESS_T2=""; SKIP_LIST=""; FAIL_LIST=""

          for pkg in $PKGLIST; do
            echo ""
            echo "════════════════════════════════════════"
            echo "📦 $pkg"
            echo "════════════════════════════════════════"

            if wheel_exists "$pkg"; then
              echo "⏭️  Skip (đã có wheel)"
              SKIP_LIST="$SKIP_LIST $pkg"
              continue
            fi

            # [FIX] Log ra file, không dùng pipe tail
            echo "🔨 Tầng 1: pip wheel"
            if "$HOST_PY" -m pip wheel "$pkg" \
                  --no-deps --no-build-isolation --no-binary=:all: \
                  --wheel-dir wheels-out > "/tmp/pip_${pkg}.log" 2>&1; then
              if wheel_exists "$pkg"; then
                echo "✅ $pkg — Tầng 1"
                SUCCESS_T1="$SUCCESS_T1 $pkg"
                continue
              fi
            else
              echo "--- pip log (tail 40) ---"
              tail -40 "/tmp/pip_${pkg}.log" || true
            fi

            echo ""
            echo "🔨 Tầng 2: p4a-style"
            if bash "$GITHUB_WORKSPACE/scripts/build-p4a-style.sh" "$pkg" > "/tmp/p4a_${pkg}.log" 2>&1; then
              if wheel_exists "$pkg"; then
                echo "✅ $pkg — Tầng 2"
                SUCCESS_T2="$SUCCESS_T2 $pkg"
                continue
              fi
            else
              echo "--- p4a log (tail 30) ---"
              tail -30 "/tmp/p4a_${pkg}.log" || true
            fi

            echo "❌ $pkg — FAILED"
            FAIL_LIST="$FAIL_LIST $pkg"
          done

          echo ""
          echo "════════════════════════════════════════"
          echo "📊 KẾT QUẢ"
          echo "════════════════════════════════════════"
          echo "⏭️  Skipped:   $SKIP_LIST"
          echo "✅ Tầng 1:     $SUCCESS_T1"
          echo "✅ Tầng 2:     $SUCCESS_T2"
          echo "❌ Failed:     $FAIL_LIST"
          ls -lh wheels-out/ || echo "(rỗng)"

      # ==========================================================
      # PATCH cryptography wheel
      # ==========================================================
      - name: Patch cryptography wheel
        run: |
          set -eo pipefail
          CRYPTO_WHL=$(ls wheels-out/cryptography-*linux_aarch64.whl 2>/dev/null | head -1)
          if [ -z "$CRYPTO_WHL" ]; then
            CRYPTO_WHL=$(ls wheels-out/cryptography-*.whl 2>/dev/null | head -1)
          fi
          if [ -z "$CRYPTO_WHL" ]; then
            echo "⚠️ Không có wheel cryptography"
            exit 0
          fi
          CRYPTO_WHL=$(realpath "$CRYPTO_WHL")
          echo "Wheel: $CRYPTO_WHL"

          WORK="/tmp/patch-whl"
          rm -rf "$WORK" && mkdir -p "$WORK"
          cd "$WORK"
          unzip -o -q "$CRYPTO_WHL"

          RUST_SO=$(find . -name "_rust*.so" | head -1)
          if [ -z "$RUST_SO" ]; then
            echo "⚠️ Không có _rust.abi3.so"
            exit 0
          fi
          echo "SO: $RUST_SO"

          if readelf -d "$RUST_SO" | grep -q "libpython${PYTHON_MINOR}.so"; then
            echo "✅ Wheel đã patch — skip"
            exit 0
          fi

          echo "=== Trước patch ==="
          readelf -d "$RUST_SO" | grep -E "NEEDED|RUNPATH|RPATH" || echo "(không có)"

          patchelf --remove-rpath "$RUST_SO" 2>/dev/null || true
          patchelf --add-needed "libpython${PYTHON_MINOR}.so" "$RUST_SO"
          patchelf --force-rpath --set-rpath '$ORIGIN/../../../../..' "$RUST_SO"

          echo "=== Sau patch ==="
          readelf -d "$RUST_SO" | grep -E "NEEDED|RUNPATH|RPATH"

          # [FIX] Cập nhật RECORD sau patch
          CRYPTO_WHL="$CRYPTO_WHL" RUST_SO_REL="$RUST_SO" "$HOST_PYTHON" - <<'PYEOF'
          import base64, hashlib, csv, os, zipfile, tempfile, shutil
          whl = os.environ["CRYPTO_WHL"]
          rust_rel = os.environ["RUST_SO_REL"].lstrip("./")
          tmp = tempfile.mkdtemp()
          try:
              with zipfile.ZipFile(whl, 'r') as z:
                  z.extractall(tmp)
              record_path = None
              for root, _, files in os.walk(tmp):
                  if 'RECORD' in files and '.dist-info' in root:
                      record_path = os.path.join(root, 'RECORD')
              if record_path:
                  with open(record_path, 'r', newline='') as f:
                      rows = list(csv.reader(f))
                  new_rows = []
                  for row in rows:
                      if len(row) >= 3 and row[0] == rust_rel:
                          full = os.path.join(tmp, rust_rel)
                          with open(full, 'rb') as fh:
                              data = fh.read()
                          digest = base64.urlsafe_b64encode(hashlib.sha256(data).digest()).rstrip(b'=').decode()
                          row = [row[0], f'sha256={digest}', str(len(data))]
                      new_rows.append(row)
                  with open(record_path, 'w', newline='') as f:
                      csv.writer(f).writerows(new_rows)
                  print("✅ RECORD updated")
              out = whl + '.tmp'
              with zipfile.ZipFile(out, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for root, _, files in os.walk(tmp):
                      for f in files:
                          full = os.path.join(root, f)
                          zf.write(full, os.path.relpath(full, tmp))
              shutil.move(out, whl)
          finally:
              shutil.rmtree(tmp, ignore_errors=True)
          PYEOF

          echo "✅ Đã patch: $CRYPTO_WHL"

      # ==========================================================
      # POST-PROCESS — [FIX] handle nhiều tag
      # ==========================================================
      - name: Post-process wheels
        env:
          ANDROID_TAG: ${{ env.ANDROID_TAG }}
        run: |
          set -eo pipefail
          mkdir -p wheels-final
          shopt -s nullglob
          COPIED=0; RENAMED=0; WARNED=0

          for whl in wheels-out/*.whl; do
            [ -f "$whl" ] || continue
            base=$(basename "$whl")

            # Pure-python → giữ nguyên
            if [[ "$base" == *"none-any"* ]]; then
              cp -n "$whl" "wheels-final/$base" 2>/dev/null && COPIED=$((COPIED+1)) || true
              continue
            fi

            # Đã đúng tag Android → giữ nguyên
            if [[ "$base" == *"${ANDROID_TAG}"* ]]; then
              cp -n "$whl" "wheels-final/$base" 2>/dev/null && COPIED=$((COPIED+1)) || true
              echo "✅ $base (giữ nguyên)"
              continue
            fi

            # Cần đổi tên: các tag glibc → android
            newname="$base"
            newname="${newname//manylinux_2_28_aarch64/${ANDROID_TAG}}"
            newname="${newname//manylinux2014_aarch64/${ANDROID_TAG}}"
            newname="${newname//manylinux_2_17_aarch64/${ANDROID_TAG}}"
            newname="${newname//linux_aarch64/${ANDROID_TAG}}"

            if [ "$newname" != "$base" ]; then
              cp "$whl" "wheels-final/$newname"
              RENAMED=$((RENAMED+1))
              echo "🔄 $base → $newname"
            else
              echo "⚠️  $base — không match pattern nào, giữ nguyên"
              cp "$whl" "wheels-final/$base"
              WARNED=$((WARNED+1))
            fi
          done

          echo ""
          echo "Copied (giữ nguyên): $COPIED"
          echo "Renamed:             $RENAMED"
          echo "Warned (giữ lạ):     $WARNED"
          ls -lh wheels-final/ || echo "(rỗng)"

      # ==========================================================
      # [NEW] Verify bionic + tag
      # ==========================================================
      - name: Verify Android wheels
        run: |
          set -eo pipefail
          GLIBC_PAT='libc\.so\.6|ld-linux|libm\.so\.6|libpthread\.so\.0'
          TAG_PAT='android_[0-9]+_[a-z0-9_]+'
          FAIL=0

          for whl in wheels-final/*.whl; do
            [ -f "$whl" ] || continue
            base=$(basename "$whl")

            # Tag check
            if [[ "$base" == *"none-any"* ]]; then
              echo "⏭️  $base (pure python)"
              continue
            fi
            if ! [[ "$base" =~ $TAG_PAT ]]; then
              echo "❌ $base — tag không phải Android"
              FAIL=$((FAIL+1))
              continue
            fi

            # Bionic check
            work=$(mktemp -d)
            unzip -q -o "$whl" -d "$work"
            bad=0
            while IFS= read -r so; do
              if readelf -d "$so" 2>/dev/null | grep -Eq "$GLIBC_PAT"; then
                echo "   ❌ $(basename "$so"):"
                readelf -d "$so" | grep -E 'NEEDED' | grep -E "$GLIBC_PAT" | sed 's/^/      /'
                bad=1
              fi
            done < <(find "$work" -name "*.so")
            rm -rf "$work"

            if [ "$bad" -eq 0 ]; then
              echo "✅ $base"
            else
              echo "❌ $base — link glibc"
              FAIL=$((FAIL+1))
            fi
          done

          if [ "$FAIL" -gt 0 ]; then
            echo ""
            echo "❌ $FAIL wheel(s) không hợp lệ — dừng workflow"
            exit 1
          fi
          echo ""
          echo "✅ Tất cả wheel đều là Android bionic"

      - name: Generate release tag
        id: tag
        run: |
          TAG="wheels-$(date +%Y%m%d-%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Create release
        if: hashFiles('wheels-final/*.whl') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Wheels ${{ steps.tag.outputs.tag }}
          body: |
            Wheels cho Android aarch64 / Python ${{ env.PYTHON_MINOR }}.
            Packages: ${{ steps.pkglist.outputs.packages }}
          files: wheels-final/*.whl
          generate_release_notes: false
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate pip index
        if: hashFiles('wheels-final/*.whl') != ''
        run: |
          python3 scripts/gen_index.py \
            wheels-final docs \
            ${{ github.repository_owner }} \
            ${{ github.event.repository.name }} \
            ${{ steps.tag.outputs.tag }}

      - name: Commit docs
        if: hashFiles('wheels-final/*.whl') != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "no change in docs/"
            exit 0
          fi
          git commit -m "chore(wheels): update index [${{ steps.tag.outputs.tag }}] [skip ci]"
          git checkout -- . 2>/dev/null || true
          git reset --hard HEAD 2>/dev/null || true
          git clean -fd -x -e wheels-out -e wheels-final 2>/dev/null || true
          echo "=== git status sau cleanup ==="
          git status --short || true
          for i in 1 2 3 4 5; do
            echo "=== Attempt $i ==="
            if git pull --rebase origin "${{ github.ref_name }}" && \
               git push origin "HEAD:${{ github.ref_name }}"; then
              echo "✅ Push OK (attempt $i)"
              exit 0
            fi
            echo "⚠️ Retry $i"
            git checkout -- . 2>/dev/null || true
            git reset --hard HEAD 2>/dev/null || true
            git clean -fd -x -e wheels-out -e wheels-final 2>/dev/null || true
            sleep 5
          done
          echo "❌ Push thất bại sau 5 lần"
          exit 1

      - name: Summary
        if: always()
        run: |
          echo "## 📦 Wheels Summary" >> $GITHUB_STEP_SUMMARY
          echo "**Release:** \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh wheels-final/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(không có)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - uses: actions/upload-artifact@v4
        if: hashFiles('wheels-final/*.whl') != ''
        with:
          name: wheels-${{ steps.tag.outputs.tag }}
          path: wheels-final/*.whl
          if-no-files-found: warn
          retention-days: 30