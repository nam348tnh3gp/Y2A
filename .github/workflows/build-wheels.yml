name: Build Android Wheels

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages (cách nhau bằng dấu cách). Để trống = đọc từ wheels/list.txt'
        required: false
        default: ''
  push:
    branches:
      - main
      - nam348tnh3gp-patch-1
    paths:
      - 'wheels/list.txt'
      - 'scripts/gen_index.py'
      - '.github/workflows/build-wheels.yml'

concurrency:
  group: build-wheels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 240

    env:
      PYTHON_VERSION: "3.13.1"
      OPENSSL_VERSION: "3.3.2"
      LIBFFI_VERSION: "3.4.6"
      SQLITE_VERSION: "3460100"
      SQLITE_YEAR: "2024"
      XZ_VERSION: "5.4.6"
      ZLIB_VERSION: "1.3.1"
      LIBXML2_VERSION: "2.12.6"
      LIBXSLT_VERSION: "1.1.39"
      LIBJPEGTURBO_VERSION: "3.0.3"
      LIBPNG_VERSION: "1.6.43"
      ANDROID_API: "24"
      TARGET_HOST: "aarch64-linux-android"

    steps:
      # ==========================================================
      # 1. SETUP
      # ==========================================================
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Host Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake libtool \
            pkg-config wget curl unzip git xz-utils python3 python3-pip patchelf \
            cmake ninja-build nasm

      - name: Setup Android NDK r25c
        run: |
          mkdir -p "$HOME/ndk"
          cd "$HOME/ndk"
          wget -q https://dl.google.com/android/repository/android-ndk-r25c-linux.zip
          unzip -q android-ndk-r25c-linux.zip
          echo "NDK=$HOME/ndk/android-ndk-r25c" >> "$GITHUB_ENV"
          echo "$HOME/ndk/android-ndk-r25c/toolchains/llvm/prebuilt/linux-x86_64/bin" >> "$GITHUB_PATH"

      # ==========================================================
      # 2. HOST PYTHON (x86_64) — dùng để CHẠY pip cross-compile
      # ==========================================================
      - name: Build Host Python
        run: |
          mkdir -p /tmp/build-host
          cd /tmp/build-host
          wget -q "https://www.python.org/ftp/python/${{ env.PYTHON_VERSION }}/Python-${{ env.PYTHON_VERSION }}.tar.xz"
          tar -xf "Python-${{ env.PYTHON_VERSION }}.tar.xz"
          cd "Python-${{ env.PYTHON_VERSION }}"
          ./configure --prefix=/tmp/host-python --enable-optimizations=no
          make -j$(nproc)
          make install
          echo "HOST_PYTHON=/tmp/host-python/bin/python3" >> "$GITHUB_ENV"

      - name: Export Cross-Compile Environment
        run: |
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64"
          DEPS_INSTALL="$GITHUB_WORKSPACE/deps-install"
          mkdir -p "$DEPS_INSTALL"

          echo "CC=$TOOLCHAIN/bin/${{ env.TARGET_HOST }}${{ env.ANDROID_API }}-clang" >> "$GITHUB_ENV"
          echo "CXX=$TOOLCHAIN/bin/${{ env.TARGET_HOST }}${{ env.ANDROID_API }}-clang++" >> "$GITHUB_ENV"
          echo "AR=$TOOLCHAIN/bin/llvm-ar" >> "$GITHUB_ENV"
          echo "RANLIB=$TOOLCHAIN/bin/llvm-ranlib" >> "$GITHUB_ENV"
          echo "STRIP=$TOOLCHAIN/bin/llvm-strip" >> "$GITHUB_ENV"
          echo "READELF=$TOOLCHAIN/bin/llvm-readelf" >> "$GITHUB_ENV"
          echo "DEPS_INSTALL=$DEPS_INSTALL" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_LIBDIR=$DEPS_INSTALL/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_SYSROOT_DIR=$DEPS_INSTALL" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$DEPS_INSTALL/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CFLAGS=-fPIC -O2 -I$DEPS_INSTALL/include -Wno-implicit-function-declaration" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$DEPS_INSTALL/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$DEPS_INSTALL/lib -Wl,--hash-style=both" >> "$GITHUB_ENV"

      # ==========================================================
      # 3. CROSS-COMPILE CORE DEPS
      # ==========================================================
      - name: Cross-Compile libffi
        run: |
          cd /tmp
          wget -q "https://github.com/libffi/libffi/releases/download/v${{ env.LIBFFI_VERSION }}/libffi-${{ env.LIBFFI_VERSION }}.tar.gz"
          tar -xf "libffi-${{ env.LIBFFI_VERSION }}.tar.gz"
          cd "libffi-${{ env.LIBFFI_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" \
            --enable-static --disable-shared
          make -j$(nproc) install

      - name: Cross-Compile OpenSSL
        run: |
          cd /tmp
          wget -q "https://github.com/openssl/openssl/releases/download/openssl-${{ env.OPENSSL_VERSION }}/openssl-${{ env.OPENSSL_VERSION }}.tar.gz" \
            || wget -q "https://www.openssl.org/source/openssl-${{ env.OPENSSL_VERSION }}.tar.gz"
          tar -xf "openssl-${{ env.OPENSSL_VERSION }}.tar.gz"
          cd "openssl-${{ env.OPENSSL_VERSION }}"

          export ANDROID_NDK_ROOT="$NDK"
          export PATH="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"

          ./Configure android-arm64 \
            -D__ANDROID_API__=${{ env.ANDROID_API }} \
            --prefix="$DEPS_INSTALL" \
            --openssldir="$DEPS_INSTALL/ssl" \
            shared no-engine no-tests no-async \
            CC="$CC" CXX="$CXX" AR="$AR" RANLIB="$RANLIB" STRIP="$STRIP" \
            -Wl,--hash-style=both

          make -j$(nproc)
          make install_sw

      - name: Cross-Compile SQLite3
        run: |
          cd /tmp
          SQLITE_URL="https://www.sqlite.org/${{ env.SQLITE_YEAR }}/sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz"
          if ! curl --output /dev/null --silent --head --fail "$SQLITE_URL"; then
            SQLITE_URL="https://www.sqlite.org/2023/sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz"
          fi
          wget -q "$SQLITE_URL"
          tar -xf "sqlite-autoconf-${{ env.SQLITE_VERSION }}.tar.gz"
          cd "sqlite-autoconf-${{ env.SQLITE_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" \
            --enable-static --disable-shared
          make -j$(nproc) install

      - name: Cross-Compile XZ
        run: |
          cd /tmp
          wget -q "https://github.com/tukaani-project/xz/releases/download/v${{ env.XZ_VERSION }}/xz-${{ env.XZ_VERSION }}.tar.gz"
          tar -xf "xz-${{ env.XZ_VERSION }}.tar.gz"
          cd "xz-${{ env.XZ_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" \
            --enable-static --disable-shared
          make -j$(nproc) install

      - name: Cross-Compile zlib
        run: |
          cd /tmp
          wget -q "https://github.com/madler/zlib/releases/download/v${{ env.ZLIB_VERSION }}/zlib-${{ env.ZLIB_VERSION }}.tar.gz"
          tar -xf "zlib-${{ env.ZLIB_VERSION }}.tar.gz"
          cd "zlib-${{ env.ZLIB_VERSION }}"
          CC="$CC" AR="$AR" RANLIB="$RANLIB" ./configure --prefix="$DEPS_INSTALL" --static
          make -j$(nproc) install

      # ==========================================================
      # 4. CROSS-COMPILE DEPS CHO lxml
      # ==========================================================
      - name: Cross-Compile libxml2 (cho lxml)
        run: |
          cd /tmp
          wget -q "https://download.gnome.org/sources/libxml2/2.12/libxml2-${{ env.LIBXML2_VERSION }}.tar.xz"
          tar -xf "libxml2-${{ env.LIBXML2_VERSION }}.tar.xz"
          cd "libxml2-${{ env.LIBXML2_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" \
            --enable-static --disable-shared \
            --without-python --without-lzma --without-zlib \
            --without-iconv --without-icu
          make -j$(nproc) install

      - name: Cross-Compile libxslt (cho lxml)
        run: |
          cd /tmp
          wget -q "https://download.gnome.org/sources/libxslt/1.1/libxslt-${{ env.LIBXSLT_VERSION }}.tar.xz"
          tar -xf "libxslt-${{ env.LIBXSLT_VERSION }}.tar.xz"
          cd "libxslt-${{ env.LIBXSLT_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" \
            --enable-static --disable-shared \
            --without-python --without-crypto
          make -j$(nproc) install

      # ==========================================================
      # 5. CROSS-COMPILE DEPS CHO Pillow
      # ==========================================================
      - name: Cross-Compile libjpeg-turbo (cho Pillow)
        run: |
          cd /tmp
          wget -q "https://github.com/libjpeg-turbo/libjpeg-turbo/releases/download/${{ env.LIBJPEGTURBO_VERSION }}/libjpeg-turbo-${{ env.LIBJPEGTURBO_VERSION }}.tar.gz"
          tar -xf "libjpeg-turbo-${{ env.LIBJPEGTURBO_VERSION }}.tar.gz"
          cd "libjpeg-turbo-${{ env.LIBJPEGTURBO_VERSION }}"
          mkdir build && cd build
          cmake -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-${{ env.ANDROID_API }} \
            -DCMAKE_INSTALL_PREFIX="$DEPS_INSTALL" \
            -DENABLE_SHARED=OFF \
            -DENABLE_STATIC=ON \
            -DWITH_TURBOJPEG=OFF \
            -DWITH_SIMD=OFF \
            ..
          ninja
          ninja install

      - name: Cross-Compile libpng (cho Pillow)
        run: |
          cd /tmp
          wget -q "https://download.sourceforge.net/libpng/libpng-${{ env.LIBPNG_VERSION }}.tar.gz" \
            || wget -q "https://github.com/pnggroup/libpng/archive/refs/tags/v${{ env.LIBPNG_VERSION }}.tar.gz" -O "libpng-${{ env.LIBPNG_VERSION }}.tar.gz"
          tar -xf "libpng-${{ env.LIBPNG_VERSION }}.tar.gz"
          cd "libpng-${{ env.LIBPNG_VERSION }}"
          ./configure --host="${{ env.TARGET_HOST }}" --prefix="$DEPS_INSTALL" \
            --enable-static --disable-shared
          make -j$(nproc) install

      # ==========================================================
      # 6. CROSS-COMPILE CPYTHON 3.13
      # ==========================================================
      - name: Cross-Compile CPython
        run: |
          cd /tmp
          tar -xf "/tmp/build-host/Python-${{ env.PYTHON_VERSION }}.tar.xz"
          cd "Python-${{ env.PYTHON_VERSION }}"

          printf '%s\n' '*disabled*' '_crypt' '_nis' 'spwd' 'ossaudiodev' \
            '_curses' '_curses_panel' 'readline' '_multiprocessing' 'nis' \
            > Modules/Setup.local

          LDFLAGS="-L$DEPS_INSTALL/lib -Wl,--hash-style=both" \
          OPENSSL_CFLAGS="-I$DEPS_INSTALL/include" \
          OPENSSL_LIBS="-L$DEPS_INSTALL/lib -lssl -lcrypto" \
          LIBFFI_CFLAGS="-I$DEPS_INSTALL/include" \
          LIBFFI_LIBS="-L$DEPS_INSTALL/lib -lffi" \
          SQLITE3_CFLAGS="-I$DEPS_INSTALL/include" \
          SQLITE3_LIBS="-L$DEPS_INSTALL/lib -lsqlite3" \
          LZMA_CFLAGS="-I$DEPS_INSTALL/include" \
          LZMA_LIBS="-L$DEPS_INSTALL/lib -llzma" \
          ./configure \
            --host="${{ env.TARGET_HOST }}" \
            --build=x86_64-pc-linux-gnu \
            --prefix="$GITHUB_WORKSPACE/python-android" \
            --with-build-python="$HOST_PYTHON" \
            --enable-shared \
            --disable-ipv6 \
            --without-ensurepip \
            --with-openssl="$DEPS_INSTALL" \
            ac_cv_file__dev_ptmx=no \
            ac_cv_file__dev_ptc=no \
            ac_cv_buggy_getaddrinfo=no \
            ac_cv_little_endian_double=yes

          make -j$(nproc)
          make install
          echo "✅ CPython built"

      # ==========================================================
      # 7. SYMLINK PATH TARGET → RUNNER (fix hardcoded path)
      # ==========================================================
      - name: Symlink target Python path
        run: |
          sudo mkdir -p /data/data/com.nam2006.y2mate/files
          sudo ln -sfn "$GITHUB_WORKSPACE/python-android" \
                        /data/data/com.nam2006.y2mate/files/python
          ls -la /data/data/com.nam2006.y2mate/files/
          echo "✅ Symlink created"

      # ==========================================================
      # 8. CÀI PIP VÀO RUNTIME TARGET
      # ==========================================================
      - name: Prepare pip for wheel building
        run: |
          SITE="$GITHUB_WORKSPACE/python-android/lib/python3.13/site-packages"
          mkdir -p "$SITE" /tmp/wheels_bootstrap
          "$HOST_PYTHON" -m pip download pip setuptools wheel \
            --dest=/tmp/wheels_bootstrap --only-binary=:all: --no-deps
          for whl in /tmp/wheels_bootstrap/*.whl; do
            unzip -o -q "$whl" -d "$SITE"
          done
          echo "✅ pip installed into target runtime"

      # ==========================================================
      # 9. ĐỌC DANH SÁCH PACKAGE
      # ==========================================================
      - name: Read package list
        id: pkglist
        run: |
          if [ -n "${{ github.event.inputs.packages }}" ]; then
            LIST="${{ github.event.inputs.packages }}"
          else
            LIST=$(grep -v '^#' wheels/list.txt | grep -v '^$' | tr '\n' ' ')
          fi
          echo "packages=$LIST" >> "$GITHUB_OUTPUT"
          echo "📦 Sẽ build: $LIST"

      # ==========================================================
      # 10. CÀI RUST (cho cryptography)
      # ==========================================================
      - name: Setup Rust for cross-compile
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | \
            sh -s -- -y --default-toolchain stable --profile minimal
          source "$HOME/.cargo/env"
          rustup target add aarch64-linux-android

          mkdir -p "$HOME/.cargo"
          cat > "$HOME/.cargo/config.toml" <<EOF
          [target.aarch64-linux-android]
          linker = "${{ env.CC }}"
          ar = "${{ env.AR }}"
          EOF

          echo "CARGO_HOME=$HOME/.cargo" >> "$GITHUB_ENV"
          echo "RUSTUP_HOME=$HOME/.rustup" >> "$GITHUB_ENV"
          echo "PATH=$HOME/.cargo/bin:$PATH" >> "$GITHUB_ENV"
          echo "✅ Rust installed"

      # ==========================================================
      # 11. BUILD WHEELS
      # ==========================================================
      - name: Build wheels for Android aarch64
        run: |
          set -eo pipefail
          HOST_PY="$HOST_PYTHON"
          TARGET_ROOT="$GITHUB_WORKSPACE/python-android"
          TARGET_STDLIB="$TARGET_ROOT/lib/python3.13"
          TARGET_SITE="$TARGET_STDLIB/site-packages"
          mkdir -p wheels-out

          # ============================================================
          # 1. Detect tên file _sysconfigdata trong target stdlib
          # ============================================================
          echo "=== Target stdlib chứa sysconfig: ==="
          ls "$TARGET_STDLIB/" | grep -i sysconfig || echo "(không tìm thấy)"

          SYSCONF_FILE=$(ls "$TARGET_STDLIB"/_sysconfigdata__*.py 2>/dev/null | head -1)
          if [ -z "$SYSCONF_FILE" ]; then
            echo "❌ Không tìm thấy _sysconfigdata*.py trong $TARGET_STDLIB"
            ls -la "$TARGET_STDLIB/" || true
            exit 1
          fi
          SYSCONF_NAME=$(basename "$SYSCONF_FILE" .py)
          echo "✅ Sysconfig data name: $SYSCONF_NAME"

          # ============================================================
          # 2. Copy _sysconfigdata ra thư mục riêng
          #    (không thêm cả stdlib target vào PYTHONPATH để tránh conflict)
          # ============================================================
          SYSCONF_DIR="$GITHUB_WORKSPACE/sysconfigdata-host"
          rm -rf "$SYSCONF_DIR"
          mkdir -p "$SYSCONF_DIR"
          cp "$SYSCONF_FILE" "$SYSCONF_DIR/"
          echo "✅ Copied: $(basename "$SYSCONF_FILE")"

          # ============================================================
          # 3. Cross-compile env cho setuptools/distutils
          # ============================================================
          export _PYTHON_HOST_PLATFORM="linux_aarch64"
          export _PYTHON_PROJECT_BASE="$TARGET_ROOT"
          export _PYTHON_SYSCONFIGDATA_NAME="$SYSCONF_NAME"
          export PYTHONPATH="$SYSCONF_DIR:$TARGET_SITE"
          export CC="$CC"
          export CXX="$CXX"
          export AR="$AR"
          export RANLIB="$RANLIB"
          export STRIP="$STRIP"
          export LDSHARED="$CC -shared"
          export CPP="$CC -E"
          export READELF="$READELF"

          export PKG_CONFIG_PATH="$DEPS_INSTALL/lib/pkgconfig"
          export PKG_CONFIG_LIBDIR="$DEPS_INSTALL/lib/pkgconfig"
          export PKG_CONFIG_SYSROOT_DIR="$DEPS_INSTALL"

          export CARGO_BUILD_TARGET="aarch64-linux-android"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$CC"
          export OPENSSL_DIR="$DEPS_INSTALL"
          export OPENSSL_LIB_DIR="$DEPS_INSTALL/lib"
          export OPENSSL_INCLUDE_DIR="$DEPS_INSTALL/include"

          # ============================================================
          # 4. Test: host Python có import được _sysconfigdata không?
          # ============================================================
          echo ""
          echo "=== Test import _sysconfigdata ==="
          "$HOST_PY" -c "import ${SYSCONF_NAME} as s; print('✅ OK, CC =', s.build_time_vars.get('CC', 'n/a'))"

          echo ""
          echo "=== Test sysconfig.get_paths() ==="
          "$HOST_PY" -c "
          import sysconfig
          paths = sysconfig.get_paths()
          for k, v in paths.items():
              print(f'  {k} = {v}')
          "

          # ============================================================
          # 5. Build từng package
          # ============================================================
          for pkg in ${{ steps.pkglist.outputs.packages }}; do
            echo ""
            echo "=========================================="
            echo "🔨 Building: $pkg"
            echo "=========================================="

            if "$HOST_PY" -m pip wheel "$pkg" \
                  --no-deps \
                  --no-build-isolation \
                  --wheel-dir wheels-out 2>&1 | tail -80; then
              echo "✅ $pkg OK"
            else
              echo "❌ $pkg FAILED (tiếp tục package khác)"
            fi
          done

          echo ""
          echo "=== Wheels built ==="
          ls -lh wheels-out/ || echo "(rỗng)"

      # ==========================================================
      # 12. POST-PROCESS: đổi tag linux_aarch64 → android_24_arm64_v8a
      # ==========================================================
      - name: Post-process wheels
        run: |
          mkdir -p wheels-final
          shopt -s nullglob
          for whl in wheels-out/*.whl; do
            [ -f "$whl" ] || continue
            base=$(basename "$whl")
            cp "$whl" "wheels-final/$base"
            if [[ "$base" == *"linux_aarch64"* ]]; then
              newname="${base//linux_aarch64/android_24_arm64_v8a}"
              cp "$whl" "wheels-final/$newname"
              echo "Tagged: $base + $newname"
            fi
          done
          echo ""
          echo "=== Final wheels ==="
          ls -lh wheels-final/ || echo "(rỗng)"

      # ==========================================================
      # 13. RELEASE
      # ==========================================================
      - name: Generate release tag
        id: tag
        run: |
          TAG="wheels-$(date +%Y%m%d-%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Tag: $TAG"

      - name: Create release with wheels
        if: hashFiles('wheels-final/*.whl') != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: Wheels ${{ steps.tag.outputs.tag }}
          body: |
            Prebuilt wheels cho Android aarch64 / Python 3.13.

            Packages: ${{ steps.pkglist.outputs.packages }}
          files: wheels-final/*.whl
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ==========================================================
      # 14. SINH PIP INDEX + COMMIT VÀO docs/
      # ==========================================================
      - name: Generate pip index HTML
        if: hashFiles('wheels-final/*.whl') != ''
        run: |
          python3 scripts/gen_index.py \
            wheels-final \
            docs \
            ${{ github.repository_owner }} \
            ${{ github.event.repository.name }} \
            ${{ steps.tag.outputs.tag }}

      - name: Commit docs index
        if: hashFiles('wheels-final/*.whl') != ''
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore(wheels): update index [${{ steps.tag.outputs.tag }}] [skip ci]"
            for i in 1 2 3 4 5; do
              if git pull --rebase origin "${{ github.ref_name }}" && \
                 git push origin "HEAD:${{ github.ref_name }}"; then
                echo "✅ Push OK (attempt $i)"
                break
              fi
              echo "⚠️ Retry push (attempt $i)"
              sleep 5
            done
          fi

      # ==========================================================
      # 15. SUMMARY
      # ==========================================================
      - name: Summary
        if: always()
        run: |
          echo "## 📦 Wheels Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Release tag:** \`${{ steps.tag.outputs.tag }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Index URL:** https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/simple/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Wheels" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          ls -lh wheels-final/ >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(không có)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload wheels artifact
        if: hashFiles('wheels-final/*.whl') != ''
        uses: actions/upload-artifact@v4
        with:
          name: wheels-${{ steps.tag.outputs.tag }}
          path: wheels-final/*.whl
          if-no-files-found: warn
          retention-days: 30