name: Build Android Wheels

on:
  workflow_dispatch:
    inputs:
      packages:
        description: 'Packages (cách nhau bằng dấu cách)'
        required: false
        default: ''
      force_rebuild:
        description: 'Force rebuild — true/false'
        required: false
        default: 'false'
      clean_old_releases:
        description: 'Xóa release cũ (giữ 3) — true/false'
        required: false
        default: 'false'
  push:
    branches: [main, nam348tnh3gp-patch-1]
    paths:
      - 'wheels/list.txt'
      - 'scripts/**'
      - 'Dockerfile.wheels'
      - '.github/workflows/build-wheels.yml'

concurrency:
  group: build-wheels
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android/sdk \
                      /opt/ghc /usr/local/share/boost 2>/dev/null || true
          df -h / | tail -1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build Docker image — layer cache cho NDK/host-python/rust
      - name: Build wheel-builder image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.wheels
          load: true
          tags: p4a-wheels:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Cache cross-compiled python (deps-install + python-android)
      - name: Cache deps-install
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/deps-install
          key: deps-aarch64-api24-v3-docker

      - name: Cache python-android
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/python-android
          key: python-android-3.13.1-v3-docker-${{ hashFiles('Dockerfile.wheels') }}

      - name: Fix permissions
        run: |
          mkdir -p deps-install python-android wheels-out wheels-final
          sudo chown -R 1000:1000 \
            deps-install python-android wheels-out wheels-final docs 2>/dev/null || true

      # Chạy container
      - name: Run build in container
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/work" \
            -w /work \
            -u 1000:1000 \
            -e GH_TOKEN \
            -e INPUT_PACKAGES="${{ github.event.inputs.packages }}" \
            -e INPUT_FORCE_REBUILD="${{ github.event.inputs.force_rebuild }}" \
            -e INPUT_CLEAN_OLD="${{ github.event.inputs.clean_old_releases }}" \
            -e REF_NAME="${{ github.ref_name }}" \
            -e GITHUB_REPO_OWNER="${{ github.repository_owner }}" \
            -e GITHUB_REPO_NAME="${{ github.event.repository.name }}" \
            p4a-wheels:latest \
            bash /work/scripts/entrypoint.sh

      # Upload artifact
      - uses: actions/upload-artifact@v4
        if: hashFiles('wheels-final/*.whl') != ''
        with:
          name: wheels-${{ github.run_id }}
          path: wheels-final/*.whl
          retention-days: 30