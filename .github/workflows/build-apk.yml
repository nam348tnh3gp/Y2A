name: Build APK

on:
  workflow_dispatch:

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # ==========================================================
      # Bump version
      # ==========================================================
      - name: Bump version code
        id: bump
        run: |
          set -e
          if [ -f versioncode.txt ]; then
            CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
            CURRENT=${CURRENT:-0}
          else
            CURRENT=0
          fi
          if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then CURRENT=0; fi
          NEW=$((CURRENT + 1))
          echo "$NEW" > versioncode.txt
          echo "🔢 Version: $CURRENT → $NEW"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versioncode.txt
          if git diff --staged --quiet; then
            echo "⚠️ Không có thay đổi"
          else
            git commit -m "chore: bump version code to ${{ steps.bump.outputs.new_version }} [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      # ==========================================================
      # ALL-IN-ONE: Download + Extract + Install + Integrate
      # ==========================================================
      - name: Setup Python runtime (all-in-one)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex

          WORKSPACE="$GITHUB_WORKSPACE"
          PY_VERSION="3.14"
          ABI="arm64-v8a"
          RUNTIME_DIR="$WORKSPACE/_python_runtime"

          echo "═══════════════════════════════════════════"
          echo "STEP 1: Xác định release"
          echo "═══════════════════════════════════════════"
          cd "$WORKSPACE"

          LATEST_TAG=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/flet-dev/python-build/releases?per_page=30" \
            | jq -r '[.[].tag_name | select(test("^[0-9]{8}$"))][0]')

          [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ] && LATEST_TAG="20260921"
          echo "✅ Release tag: $LATEST_TAG"

          echo ""
          echo "═══════════════════════════════════════════"
          echo "STEP 2: Tải manifest"
          echo "═══════════════════════════════════════════"
          MANIFEST_URL="https://github.com/flet-dev/python-build/releases/download/${LATEST_TAG}/manifest.json"
          echo "URL: $MANIFEST_URL"

          rm -f manifest.json
          wget -q -O manifest.json "$MANIFEST_URL"

          echo "Manifest content:"
          cat manifest.json
          echo ""

          FULL_VERSION=$(jq -r --arg pv "$PY_VERSION" '.pythons[$pv].full_version // empty' manifest.json)
          if [ -z "$FULL_VERSION" ]; then
            echo "❌ Không có full_version"
            jq -r '.pythons | keys[]' manifest.json
            exit 1
          fi
          echo "✅ Full version: $FULL_VERSION"

          echo ""
          echo "═══════════════════════════════════════════"
          echo "STEP 3: Tải tarball"
          echo "═══════════════════════════════════════════"
          TARBALL="python-android-dart-${FULL_VERSION}-${ABI}.tar.gz"
          URL="https://github.com/flet-dev/python-build/releases/download/${LATEST_TAG}/${TARBALL}"
          echo "URL: $URL"

          rm -rf "$RUNTIME_DIR"
          mkdir -p "$RUNTIME_DIR"
          cd "$RUNTIME_DIR"

          wget -q -O "$TARBALL" "$URL"
          ls -la "$RUNTIME_DIR"

          SIZE=$(stat -c%s "$TARBALL")
          echo "📦 Tarball size: $SIZE bytes"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "❌ Tarball quá nhỏ"
            head -c 500 "$TARBALL"
            exit 1
          fi

          echo "File type:"
          file "$TARBALL"

          echo ""
          echo "═══════════════════════════════════════════"
          echo "STEP 4: Extract tarball"
          echo "═══════════════════════════════════════════"
          tar -xzf "$TARBALL"

          echo "After extract:"
          ls -la "$RUNTIME_DIR"

          echo ""
          echo "Full directory tree (depth 3):"
          find "$RUNTIME_DIR" -maxdepth 3 -type d | sort | head -40

          echo ""
          echo "Tìm os.py:"
          find "$RUNTIME_DIR" -name "os.py" | head -5

          echo ""
          echo "Tìm libpython:"
          find "$RUNTIME_DIR" -name "libpython*.so" | head -5

          echo ""
          echo "Tìm Python.h:"
          find "$RUNTIME_DIR" -name "Python.h" | head -5

          echo ""
          echo "═══════════════════════════════════════════"
          echo "STEP 5: Tìm stdlib"
          echo "═══════════════════════════════════════════"
          STDLIB_DIR=$(find "$RUNTIME_DIR" -type f -name "os.py" -exec dirname {} \; | head -1)

          if [ -z "$STDLIB_DIR" ]; then
            echo "❌ Không có stdlib. Nội dung runtime:"
            find "$RUNTIME_DIR" -type f | head -30
            exit 1
          fi

          echo "✅ Stdlib dir: $STDLIB_DIR"
          echo "Content:"
          ls "$STDLIB_DIR" | head -20

          echo ""
          echo "═══════════════════════════════════════════"
          echo "STEP 6: Cài pip + yt-dlp"
          echo "═══════════════════════════════════════════"
          SITE_PACKAGES="$STDLIB_DIR/site-packages"
          mkdir -p "$SITE_PACKAGES"

          python3 -m pip install --upgrade pip
          python3 -m pip install --target="$SITE_PACKAGES" \
            --no-compile --only-binary=:all: --no-deps \
            yt-dlp certifi

          echo "✅ Đã cài:"
          ls -la "$SITE_PACKAGES/"

          echo ""
          echo "═══════════════════════════════════════════"
          echo "STEP 7: Copy vào Android project"
          echo "═══════════════════════════════════════════"

          # 7a. libpython → jniLibs
          LIBPY=$(find "$RUNTIME_DIR" -name "libpython*.so" | head -1)
          if [ -z "$LIBPY" ]; then
            echo "❌ Không có libpython"
            find "$RUNTIME_DIR" -name "*.so" | head -20
            exit 1
          fi

          mkdir -p "$WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cp "$LIBPY" "$WORKSPACE/app/src/main/jniLibs/arm64-v8a/libpython3.14.so"
          echo "✅ libpython → jniLibs"

          # 7b. stdlib → assets
          STDLIB_NAME=$(basename "$STDLIB_DIR")
          mkdir -p "$WORKSPACE/app/src/main/assets/python"
          cp -r "$STDLIB_DIR" "$WORKSPACE/app/src/main/assets/python/"
          echo "✅ stdlib → assets/python/$STDLIB_NAME"

          # 7c. Headers → cpp/include
          INCLUDE_DIR=$(find "$RUNTIME_DIR" -name "Python.h" -exec dirname {} \; | head -1)
          if [ -n "$INCLUDE_DIR" ]; then
            mkdir -p "$WORKSPACE/app/src/main/cpp/include"
            cp -r "$INCLUDE_DIR"/* "$WORKSPACE/app/src/main/cpp/include/"
            echo "✅ Headers → cpp/include/"
          else
            echo "⚠️ Không có Python.h"
          fi

          # 7d. Native .so khác → jniLibs
          find "$RUNTIME_DIR" -name "*.so" ! -name "libpython*.so" | while read -r so; do
            name=$(basename "$so")
            [[ "$name" =~ ^(lib.+\.so)\.[0-9]+$ ]] && name="${BASH_REMATCH[1]}"
            cp "$so" "$WORKSPACE/app/src/main/jniLibs/arm64-v8a/$name" 2>/dev/null || true
            echo "  📚 $name"
          done

          echo ""
          echo "═══════════════════════════════════════════"
          echo "STEP 8: Verify"
          echo "═══════════════════════════════════════════"
          echo "jniLibs:"
          ls -lh "$WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
          echo ""
          echo "assets/python:"
          ls -lh "$WORKSPACE/app/src/main/assets/python/"
          echo ""
          echo "cpp/include:"
          ls "$WORKSPACE/app/src/main/cpp/include/" 2>/dev/null | head -5
          echo ""
          echo "Sizes:"
          du -sh "$WORKSPACE/app/src/main/jniLibs/"
          du -sh "$WORKSPACE/app/src/main/assets/"
          echo ""
          echo "✅ HOÀN TẤT"

      # ==========================================================
      # Setup debug keystore
      # ==========================================================
      - name: Setup debug keystore
        run: |
          set -e
          mkdir -p ~/.android
          if [ -f "debug.keystore" ]; then
            cp debug.keystore ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | head -5
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # ==========================================================
      # Build APK
      # ==========================================================
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          set -e
          VERSION=${{ steps.bump.outputs.new_version }}
          for f in app/build/outputs/apk/release/*.apk; do
            [[ "$f" != *".apk" ]] || [[ "$f" == *"-unaligned"* ]] && continue
            DIR=$(dirname "$f"); BASE=$(basename "$f" .apk)
            mv "$f" "${DIR}/${BASE}-v${VERSION}.apk"
          done
          ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: Mini-Y2mate-Pro-v${{ steps.bump.outputs.new_version }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error