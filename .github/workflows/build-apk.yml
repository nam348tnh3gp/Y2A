name: Build APK

on:
  workflow_dispatch:

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # ==========================================================
      # Bump version
      # ==========================================================
      - name: Bump version code
        id: bump
        run: |
          set -e
          if [ -f versioncode.txt ]; then
            CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
            CURRENT=${CURRENT:-0}
          else
            CURRENT=0
          fi
          if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then CURRENT=0; fi
          NEW=$((CURRENT + 1))
          echo "$NEW" > versioncode.txt
          echo "🔢 Version: $CURRENT → $NEW"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versioncode.txt
          if git diff --staged --quiet; then
            echo "⚠️ Không có thay đổi"
          else
            git commit -m "chore: bump version code to ${{ steps.bump.outputs.new_version }} [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      # ==========================================================
      # Lấy latest release của flet-dev/python-build
      # ==========================================================
      - name: Get latest python-build release tag
        id: python-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          LATEST_TAG=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/flet-dev/python-build/releases?per_page=30" \
            | jq -r '[.[].tag_name | select(test("^[0-9]{8}$"))][0]')

          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            echo "⚠️ Không tìm được tag, dùng fallback"
            LATEST_TAG="20260921"
          fi
          echo "✅ Latest release: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      # ==========================================================
      # Download Python runtime (với verification đầy đủ)
      # ==========================================================
      - name: Download Python runtime
        id: python-runtime
        env:
          PY_BUILD_RELEASE: ${{ steps.python-release.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          PY_VERSION="3.14"
          ABI="arm64-v8a"

          # ---- 1. Tải manifest.json ----
          MANIFEST_URL="https://github.com/flet-dev/python-build/releases/download/${PY_BUILD_RELEASE}/manifest.json"
          echo "📥 Manifest URL: $MANIFEST_URL"
          wget -q -O manifest.json "$MANIFEST_URL"

          # Verify manifest không phải HTML
          if head -c 100 manifest.json | grep -q "<!DOCTYPE\|<html"; then
            echo "❌ Manifest là HTML (404?) — nội dung:"
            head -20 manifest.json
            exit 1
          fi

          echo "✅ Manifest OK ($(wc -c < manifest.json) bytes)"
          echo "Nội dung:"
          cat manifest.json | head -30
          echo ""

          # ---- 2. Lấy full_version ----
          FULL_VERSION=$(jq -r --arg pv "$PY_VERSION" '.pythons[$pv].full_version // empty' manifest.json)
          if [ -z "$FULL_VERSION" ]; then
            echo "❌ Không có full_version cho $PY_VERSION"
            echo "Keys có sẵn:"
            jq -r '.pythons | keys[]' manifest.json
            exit 1
          fi
          echo "🐍 Full Python version: $FULL_VERSION"

          # ---- 3. Tải tarball ----
          TARBALL="python-android-dart-${FULL_VERSION}-${ABI}.tar.gz"
          URL="https://github.com/flet-dev/python-build/releases/download/${PY_BUILD_RELEASE}/${TARBALL}"
          echo "📥 Tarball URL: $URL"

          mkdir -p _python_runtime
          cd _python_runtime

          if ! wget -q --show-progress -O "$TARBALL" "$URL"; then
            echo "❌ wget fail. Assets có sẵn:"
            curl -sL -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/flet-dev/python-build/releases/tags/${PY_BUILD_RELEASE}" \
              | jq -r '.assets[].name' | grep -i "android.*arm64" || true
            exit 1
          fi

          # ---- 4. Verify tarball ----
          SIZE=$(stat -c%s "$TARBALL" 2>/dev/null || stat -f%z "$TARBALL")
          echo "📦 Tarball size: $SIZE bytes (~$((SIZE/1024/1024)) MB)"

          if [ "$SIZE" -lt 1000000 ]; then
            echo "❌ Tarball quá nhỏ (<1MB) — không phải file thật"
            echo "Nội dung (100 bytes đầu):"
            head -c 100 "$TARBALL"
            echo ""
            file "$TARBALL"
            exit 1
          fi

          echo "File type:"
          file "$TARBALL"
          echo ""

          # ---- 5. Xem nội dung tarball trước extract ----
          echo "🔍 Contents (10 entry đầu):"
          tar -tzf "$TARBALL" 2>&1 | head -10
          echo ""
          echo "Tổng entries: $(tar -tzf "$TARBALL" 2>/dev/null | wc -l)"
          echo ""

          echo "Tìm trong tarball:"
          echo "  os.py:     $(tar -tzf "$TARBALL" 2>/dev/null | grep 'os\.py$' | head -3)"
          echo "  libpython: $(tar -tzf "$TARBALL" 2>/dev/null | grep 'libpython.*\.so' | head -3)"
          echo "  Python.h:  $(tar -tzf "$TARBALL" 2>/dev/null | grep 'Python\.h$' | head -3)"
          echo ""

          # ---- 6. Extract ----
          echo "📦 Extracting..."
          if ! tar -xzf "$TARBALL" 2>&1; then
            echo "❌ tar extract fail"
            exit 1
          fi

          # ---- 7. Verify sau extract ----
          echo ""
          echo "📂 ls -la sau extract:"
          ls -la
          echo ""

          echo "🌳 Cấu trúc thư mục (max depth 3):"
          find . -maxdepth 3 -type d | sort | head -30
          echo ""

          echo "🔍 File quan trọng:"
          echo "  libpython: $(find . -name 'libpython*.so' | head -3)"
          echo "  os.py:     $(find . -name 'os.py' | head -3)"
          echo "  Python.h:  $(find . -name 'Python.h' | head -3)"
          echo ""

          echo "📊 Size: $(du -sh . | cut -f1)"

      # ==========================================================
      # Install pip + yt-dlp
      # ==========================================================
      - name: Install pip and yt-dlp
        env:
          PY_VERSION: "3.14"
        run: |
          set -e
          cd _python_runtime

          # Tìm stdlib ở MỌI cấp thư mục
          STDLIB_DIR=""

          # Cách 1: tìm os.py trong python3.14
          STDLIB_DIR=$(find . -type f -name "os.py" -path "*python${PY_VERSION}*" -exec dirname {} \; 2>/dev/null | head -1)
          echo "Cách 1: '$STDLIB_DIR'"

          # Cách 2: tìm folder tên python3.14
          if [ -z "$STDLIB_DIR" ]; then
            STDLIB_DIR=$(find . -type d -name "python${PY_VERSION}" 2>/dev/null | head -1)
            echo "Cách 2: '$STDLIB_DIR'"
          fi

          # Cách 3: tìm BẤT KỲ os.py nào
          if [ -z "$STDLIB_DIR" ]; then
            STDLIB_DIR=$(find . -type f -name "os.py" -exec dirname {} \; 2>/dev/null | head -1)
            echo "Cách 3: '$STDLIB_DIR'"
          fi

          # Cách 4: tìm BẤT KỲ folder nào tên python3.x
          if [ -z "$STDLIB_DIR" ]; then
            STDLIB_DIR=$(find . -type d -name "python3*" 2>/dev/null | head -1)
            echo "Cách 4: '$STDLIB_DIR'"
          fi

          if [ -z "$STDLIB_DIR" ]; then
            echo "❌ Không tìm được stdlib sau 4 cách. Cấu trúc thực:"
            find . -type d | sort | head -50
            echo ""
            echo "Danh sách file .py (20 đầu):"
            find . -name "*.py" | head -20
            echo ""
            echo "Danh sách folder chứa lib:"
            find . -type d -name "lib*" | head -20
            exit 1
          fi

          echo "📁 Stdlib tìm được: $STDLIB_DIR"
          SITE_PACKAGES="$STDLIB_DIR/site-packages"
          mkdir -p "$SITE_PACKAGES"

          echo ""
          echo "📥 Cài pip + yt-dlp + certifi..."
          python3 -m pip install --upgrade pip
          python3 -m pip install --target="$SITE_PACKAGES" \
            --no-compile --only-binary=:all: --no-deps \
            yt-dlp certifi

          echo ""
          echo "✅ Đã cài vào $SITE_PACKAGES:"
          ls -la "$SITE_PACKAGES/" | head -20
          echo "Size: $(du -sh "$SITE_PACKAGES" | cut -f1)"

          echo "STDLIB_PATH=$STDLIB_DIR" >> "$GITHUB_ENV"

      # ==========================================================
      # Integrate runtime vào Android project
      # ==========================================================
      - name: Integrate runtime
        env:
          PY_VERSION: "3.14"
        run: |
          set -e
          cd _python_runtime

          # 1. libpython → jniLibs
          LIBPY=$(find . -name "libpython${PY_VERSION}.so" 2>/dev/null | head -1)
          if [ -z "$LIBPY" ]; then
            LIBPY=$(find . -name "libpython*.so" 2>/dev/null | head -1)
          fi
          [ -z "$LIBPY" ] && { echo "❌ Không có libpython"; find . -name "*.so" | head -20; exit 1; }
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp "$LIBPY" ../app/src/main/jniLibs/arm64-v8a/libpython3.14.so
          echo "✅ libpython: $LIBPY"

          # 2. stdlib → assets
          STDLIB_DIR=$(find . -type f -name "os.py" -exec dirname {} \; 2>/dev/null | head -1)
          [ -z "$STDLIB_DIR" ] && { echo "❌ Không có stdlib"; exit 1; }
          STDLIB_NAME=$(basename "$STDLIB_DIR")
          echo "📁 Stdlib: $STDLIB_DIR (name: $STDLIB_NAME)"

          mkdir -p ../app/src/main/assets/python
          cp -r "$STDLIB_DIR" ../app/src/main/assets/python/
          echo "✅ Copy → assets/python/$STDLIB_NAME"

          # 3. Headers → cpp/include
          INCLUDE_DIR=$(find . -name "Python.h" -exec dirname {} \; 2>/dev/null | head -1)
          if [ -n "$INCLUDE_DIR" ]; then
            mkdir -p ../app/src/main/cpp/include
            cp -r "$INCLUDE_DIR"/* ../app/src/main/cpp/include/
            echo "✅ Headers: $INCLUDE_DIR"
          else
            echo "⚠️ Không có Python.h"
          fi

          # 4. Native .so khác → jniLibs
          find . -name "*.so" ! -name "libpython*.so" 2>/dev/null | while read -r so; do
            name=$(basename "$so")
            [[ "$name" =~ ^(lib.+\.so)\.[0-9]+$ ]] && name="${BASH_REMATCH[1]}"
            cp "$so" "../app/src/main/jniLibs/arm64-v8a/$name" 2>/dev/null || true
            echo "  📚 $name"
          done

          echo ""
          echo "📋 jniLibs:"; ls -lh ../app/src/main/jniLibs/arm64-v8a/
          echo "📋 assets/python:"; ls -lh ../app/src/main/assets/python/
          echo "📋 cpp/include:"; ls ../app/src/main/cpp/include/ 2>/dev/null | head -5
          echo "📊 Sizes:"
          du -sh ../app/src/main/jniLibs/ ../app/src/main/assets/ ../app/src/main/cpp/include/ 2>/dev/null || true

      # ==========================================================
      # Setup debug keystore
      # ==========================================================
      - name: Setup debug keystore
        run: |
          set -e
          mkdir -p ~/.android
          if [ -f "debug.keystore" ]; then
            cp debug.keystore ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | head -5
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # ==========================================================
      # Build APK
      # ==========================================================
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          set -e
          VERSION=${{ steps.bump.outputs.new_version }}
          for f in app/build/outputs/apk/release/*.apk; do
            [[ "$f" != *".apk" ]] || [[ "$f" == *"-unaligned"* ]] && continue
            DIR=$(dirname "$f"); BASE=$(basename "$f" .apk)
            mv "$f" "${DIR}/${BASE}-v${VERSION}.apk"
          done
          ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: Mini-Y2mate-Pro-v${{ steps.bump.outputs.new_version }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error