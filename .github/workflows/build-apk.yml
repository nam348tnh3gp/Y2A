name: Build APK

on:
  workflow_dispatch:

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # ==========================================================
      # Bump version code
      # ==========================================================
      - name: Bump version code
        id: bump
        run: |
          set -e
          if [ -f versioncode.txt ]; then
            CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
            CURRENT=${CURRENT:-0}
          else
            CURRENT=0
          fi
          if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then CURRENT=0; fi
          NEW=$((CURRENT + 1))
          echo "$NEW" > versioncode.txt
          echo "🔢 Version: $CURRENT → $NEW"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versioncode.txt
          if git diff --staged --quiet; then
            echo "⚠️ Không có thay đổi"
          else
            git commit -m "chore: bump version code to ${{ steps.bump.outputs.new_version }} [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      # ==========================================================
      # Download FFmpeg from Termux
      # ==========================================================
      - name: Download FFmpeg from Termux
        run: |
          set -e
          FFMPEG_VERSION="8.1.3"
          ARCH="aarch64"
          DEB_URL="https://packages.termux.dev/apt/termux-main/pool/main/f/ffmpeg/ffmpeg_${FFMPEG_VERSION}_${ARCH}.deb"

          echo "📥 Downloading FFmpeg ${FFMPEG_VERSION}..."
          wget -q -O ffmpeg.deb "${DEB_URL}" || {
            wget -q -O ffmpeg.deb "https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main/pool/main/f/ffmpeg/ffmpeg_${FFMPEG_VERSION}_${ARCH}.deb"
          }

          echo "📦 Extracting..."
          mkdir -p ffmpeg-extracted
          dpkg-deb -xv ffmpeg.deb ./ffmpeg-extracted

          TERMUX_BIN="./ffmpeg-extracted/data/data/com.termux/files/usr/bin"
          TERMUX_LIB="./ffmpeg-extracted/data/data/com.termux/files/usr/lib"

          [ ! -f "${TERMUX_BIN}/ffmpeg" ] && { echo "❌ No ffmpeg binary"; exit 1; }

          mkdir -p app/src/main/jniLibs/arm64-v8a
          mkdir -p app/src/main/assets/ffmpeg/lib

          cp "${TERMUX_BIN}/ffmpeg" app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          [ -f "${TERMUX_BIN}/ffprobe" ] && cp "${TERMUX_BIN}/ffprobe" app/src/main/jniLibs/arm64-v8a/libffprobe.so

          if [ -d "${TERMUX_LIB}" ]; then
            find "${TERMUX_LIB}" -maxdepth 1 -type f \
              \( -name "libav*.so*" -o -name "libsw*.so*" -o -name "libpostproc*.so*" \) \
              -exec cp {} app/src/main/assets/ffmpeg/lib/ \;
          fi

          chmod 755 app/src/main/jniLibs/arm64-v8a/libffmpeg.so
          echo "✅ FFmpeg OK"
          ls -la app/src/main/jniLibs/arm64-v8a/

      # ==========================================================
      # Setup Python runtime (flet-dev/python-build)
      # ==========================================================
      - name: Setup Python runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          WORKSPACE="$GITHUB_WORKSPACE"
          PY_VERSION="3.14"
          ABI="arm64-v8a"

          # ---- STEP 1: Lấy release ----
          echo "═══ STEP 1: Tìm release ═══"
          LATEST_TAG=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/flet-dev/python-build/releases?per_page=30" \
            | jq -r '[.[].tag_name | select(test("^[0-9]{8}$"))][0]')
          [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ] && LATEST_TAG="20260921"
          echo "✅ Release: $LATEST_TAG"

          # ---- STEP 2: Manifest ----
          echo "═══ STEP 2: Manifest ═══"
          wget -q -O manifest.json "https://github.com/flet-dev/python-build/releases/download/${LATEST_TAG}/manifest.json"
          FULL_VERSION=$(jq -r --arg pv "$PY_VERSION" '.pythons[$pv].full_version // empty' manifest.json)
          [ -z "$FULL_VERSION" ] && { echo "❌ No full_version"; exit 1; }
          echo "✅ Full version: $FULL_VERSION"

          # ---- STEP 3: Tải tarball ----
          echo "═══ STEP 3: Download tarball ═══"
          TARBALL="python-android-dart-${FULL_VERSION}-${ABI}.tar.gz"
          URL="https://github.com/flet-dev/python-build/releases/download/${LATEST_TAG}/${TARBALL}"
          rm -rf "$WORKSPACE/_python_runtime"
          mkdir -p "$WORKSPACE/_python_runtime"
          cd "$WORKSPACE/_python_runtime"
          wget -q -O "$TARBALL" "$URL"
          tar -xzf "$TARBALL"
          ls -la

          # ---- STEP 4: Copy TẤT CẢ .so vào jniLibs ----
          echo "═══ STEP 4: Copy .so → jniLibs ═══"
          mkdir -p "$WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          for so in *.so; do
            [ -f "$so" ] || continue
            cp "$so" "$WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
            echo "  ✅ $so"
          done

          # ---- STEP 5: Tải yt-dlp + certifi, extract vào assets/python/site-packages ----
          echo "═══ STEP 5: yt-dlp + certifi → assets/python/site-packages ═══"
          rm -rf "$WORKSPACE/_wheels"
          mkdir -p "$WORKSPACE/_wheels"
          cd "$WORKSPACE/_wheels"

          python3 -m pip download yt-dlp certifi \
            --no-deps --only-binary=:all: -d .
          ls -la *.whl

          SITE_PACKAGES="$WORKSPACE/app/src/main/assets/python/site-packages"
          rm -rf "$SITE_PACKAGES"
          mkdir -p "$SITE_PACKAGES"

          for whl in *.whl; do
            echo "  Extract: $whl"
            unzip -q "$whl" -d "$SITE_PACKAGES"
          done

          echo "site-packages contents:"
          ls "$SITE_PACKAGES" | head -20

          # ---- STEP 6: Copy yt_dlp_bridge.py ----
          echo "═══ STEP 6: yt_dlp_bridge.py → assets/ ═══"
          if [ ! -f "$WORKSPACE/app/src/main/python/yt_dlp_bridge.py" ]; then
            echo "❌ Missing yt_dlp_bridge.py"
            find "$WORKSPACE/app" -name "yt_dlp_bridge.py"
            exit 1
          fi
          cp "$WORKSPACE/app/src/main/python/yt_dlp_bridge.py" \
             "$WORKSPACE/app/src/main/assets/yt_dlp_bridge.py"
          echo "✅ Copied"

          # ---- STEP 7: Verify ----
          echo "═══ STEP 7: Verify ═══"
          echo "📋 jniLibs:"
          ls -lh "$WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
          echo ""
          echo "📋 assets/python/:"
          ls -lh "$WORKSPACE/app/src/main/assets/python/"
          echo ""
          echo "📋 assets/python/site-packages/ (top level):"
          ls "$WORKSPACE/app/src/main/assets/python/site-packages/" | head -10
          echo ""
          echo "📋 assets/ root:"
          ls -lh "$WORKSPACE/app/src/main/assets/" | head -10
          echo ""
          echo "📊 Sizes:"
          du -sh "$WORKSPACE/app/src/main/jniLibs/"
          du -sh "$WORKSPACE/app/src/main/assets/"
          echo ""
          echo "✅ DONE"

      # ==========================================================
      # Setup debug keystore
      # ==========================================================
      - name: Setup debug keystore
        run: |
          set -e
          mkdir -p ~/.android
          if [ -f "debug.keystore" ]; then
            cp debug.keystore ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | head -5
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # ==========================================================
      # Build APK
      # ==========================================================
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK with version
        run: |
          set -e
          VERSION=${{ steps.bump.outputs.new_version }}
          for f in app/build/outputs/apk/release/*.apk; do
            if [[ "$f" != *".apk" ]] || [[ "$f" == *"-unaligned"* ]]; then continue; fi
            DIR=$(dirname "$f")
            BASE=$(basename "$f" .apk)
            mv "$f" "${DIR}/${BASE}-v${VERSION}.apk"
          done
          ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: Mini-Y2mate-Pro-v${{ steps.bump.outputs.new_version }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error