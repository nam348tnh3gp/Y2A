name: Build APK

on:
  workflow_dispatch:

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # ---------- Bump version ----------
      - name: Bump version code
        id: bump
        run: |
          set -e
          if [ -f versioncode.txt ]; then
            CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
            CURRENT=${CURRENT:-0}
          else
            CURRENT=0
          fi
          if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then CURRENT=0; fi
          NEW=$((CURRENT + 1))
          echo "$NEW" > versioncode.txt
          echo "🔢 Version: $CURRENT → $NEW"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versioncode.txt
          if git diff --staged --quiet; then
            echo "⚠️ Không có thay đổi"
          else
            git commit -m "chore: bump version code to ${{ steps.bump.outputs.new_version }} [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      # ---------- Get latest python-build release ----------
      - name: Get latest python-build release tag
        id: python-release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          LATEST_TAG=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/flet-dev/python-build/releases/latest" \
            | jq -r '.tag_name')
          if [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ]; then
            LATEST_TAG="20260921"
          fi
          echo "✅ Latest python-build release: $LATEST_TAG"
          echo "tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      # ---------- Download python-build runtime ----------
      - name: Download Python runtime
        env:
          PY_BUILD_RELEASE: ${{ steps.python-release.outputs.tag }}
        run: |
          set -e
          PY_VERSION="3.14"
          ABI="arm64-v8a"
          TARBALL="python-android-dart-${PY_VERSION}-${ABI}.tar.gz"
          URL="https://github.com/flet-dev/python-build/releases/download/${PY_BUILD_RELEASE}/${TARBALL}"

          echo "📥 Downloading: $URL"
          mkdir -p _python_runtime
          cd _python_runtime

          if ! wget -q --show-progress -O "$TARBALL" "$URL"; then
            echo "❌ Tải thất bại. Liệt kê assets..."
            curl -sL -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              "https://api.github.com/repos/flet-dev/python-build/releases/tags/${PY_BUILD_RELEASE}" \
              | jq -r '.assets[].name' || true
            exit 1
          fi

          tar -xzf "$TARBALL"
          echo "📂 Structure:"
          find . -maxdepth 3 -type d | head -20

      # ---------- Install pip + yt-dlp ----------
      - name: Install pip and yt-dlp
        env:
          PY_VERSION: "3.14"
        run: |
          set -e
          cd _python_runtime

          STDLIB_DIR=$(find . -type d -name "python${PY_VERSION}" -path "*/lib/*" | head -1)
          if [ -z "$STDLIB_DIR" ]; then
            echo "❌ Không tìm thấy stdlib"
            find . -name "os.py" | head -5
            exit 1
          fi
          echo "📁 Stdlib: $STDLIB_DIR"

          SITE_PACKAGES="$STDLIB_DIR/site-packages"
          mkdir -p "$SITE_PACKAGES"

          # yt-dlp là pure Python → wheel py3-none-any
          python3 -m pip install --upgrade pip
          python3 -m pip install --target="$SITE_PACKAGES" \
            --no-compile --only-binary=:all: --no-deps \
            yt-dlp certifi

          echo "✅ Đã cài:"
          ls -la "$SITE_PACKAGES/"
          du -sh "$SITE_PACKAGES"

      # ---------- Copy runtime vào Android project ----------
      - name: Integrate runtime
        env:
          PY_VERSION: "3.14"
        run: |
          set -e
          cd _python_runtime

          # libpython*.so → jniLibs
          LIBPY=$(find . -name "libpython${PY_VERSION}.so" | head -1)
          [ -z "$LIBPY" ] && { echo "❌ Không có libpython"; exit 1; }
          mkdir -p ../app/src/main/jniLibs/arm64-v8a
          cp "$LIBPY" ../app/src/main/jniLibs/arm64-v8a/libpython3.14.so
          echo "✅ $LIBPY → jniLibs"

          # Stdlib → assets
          STDLIB_DIR=$(find . -type d -name "python${PY_VERSION}" -path "*/lib/*" | head -1)
          STDLIB_PARENT=$(dirname "$STDLIB_DIR")
          mkdir -p ../app/src/main/assets/python
          cp -r "$STDLIB_PARENT/python${PY_VERSION}" ../app/src/main/assets/python/
          echo "✅ stdlib → assets/python/python3.14/"

          # Native .so khác → jniLibs
          find . -name "*.so" ! -name "libpython*.so" | while read -r so; do
            name=$(basename "$so")
            [[ "$name" =~ ^(lib.+\.so)\.[0-9]+$ ]] && name="${BASH_REMATCH[1]}"
            cp "$so" "../app/src/main/jniLibs/arm64-v8a/$name"
            echo "  📚 $name"
          done

          echo ""
          echo "📋 jniLibs:"
          ls -lh ../app/src/main/jniLibs/arm64-v8a/
          echo "📋 assets:"
          du -sh ../app/src/main/assets/

      # ---------- Setup debug keystore ----------
      - name: Setup debug keystore
        run: |
          set -e
          mkdir -p ~/.android
          if [ -f "debug.keystore" ]; then
            cp debug.keystore ~/.android/debug.keystore
            keytool -list -keystore ~/.android/debug.keystore -storepass android | head -5
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # ---------- Build APK ----------
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          set -e
          VERSION=${{ steps.bump.outputs.new_version }}
          for f in app/build/outputs/apk/release/*.apk; do
            [[ "$f" != *".apk" ]] || [[ "$f" == *"-unaligned"* ]] && continue
            DIR=$(dirname "$f"); BASE=$(basename "$f" .apk)
            mv "$f" "${DIR}/${BASE}-v${VERSION}.apk"
          done
          ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: Mini-Y2mate-Pro-v${{ steps.bump.outputs.new_version }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error