name: Build APK

on:
  workflow_dispatch:

concurrency:
  group: version-bump
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: android-actions/setup-android@v4

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      # Bump version
      - name: Bump version code
        id: bump
        run: |
          set -e
          if [ -f versioncode.txt ]; then
            CURRENT=$(cat versioncode.txt | tr -d '[:space:]')
            CURRENT=${CURRENT:-0}
          else
            CURRENT=0
          fi
          if ! [[ "$CURRENT" =~ ^[0-9]+$ ]]; then CURRENT=0; fi
          NEW=$((CURRENT + 1))
          echo "$NEW" > versioncode.txt
          echo "🔢 Version: $CURRENT → $NEW"
          echo "new_version=$NEW" >> "$GITHUB_OUTPUT"

      - name: Commit version bump
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versioncode.txt
          if git diff --staged --quiet; then echo "no change"
          else
            git commit -m "chore: bump to ${{ steps.bump.outputs.new_version }} [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} || true
            git push origin HEAD:${{ github.ref_name }}
          fi

      # ==========================================================
      # Setup Python runtime + yt-dlp (all-in-one)
      # ==========================================================
      - name: Setup Python runtime
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          WORKSPACE="$GITHUB_WORKSPACE"
          PY_VERSION="3.14"
          ABI="arm64-v8a"

          # ---- 1. Lấy release tag ----
          LATEST_TAG=$(curl -sL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            "https://api.github.com/repos/flet-dev/python-build/releases?per_page=30" \
            | jq -r '[.[].tag_name | select(test("^[0-9]{8}$"))][0]')
          [ -z "$LATEST_TAG" ] || [ "$LATEST_TAG" = "null" ] && LATEST_TAG="20260921"
          echo "✅ Release: $LATEST_TAG"

          # ---- 2. Manifest ----
          wget -q -O manifest.json "https://github.com/flet-dev/python-build/releases/download/${LATEST_TAG}/manifest.json"
          FULL_VERSION=$(jq -r --arg pv "$PY_VERSION" '.pythons[$pv].full_version' manifest.json)
          echo "✅ Full version: $FULL_VERSION"

          # ---- 3. Tải tarball ----
          TARBALL="python-android-dart-${FULL_VERSION}-${ABI}.tar.gz"
          URL="https://github.com/flet-dev/python-build/releases/download/${LATEST_TAG}/${TARBALL}"
          rm -rf "$WORKSPACE/_python_runtime"
          mkdir -p "$WORKSPACE/_python_runtime"
          cd "$WORKSPACE/_python_runtime"
          wget -q -O "$TARBALL" "$URL"
          tar -xzf "$TARBALL"

          echo "Runtime files:"
          ls -la

          # ---- 4. Copy .so vào jniLibs ----
          mkdir -p "$WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          for so in libpython3.14.so libpythonbundle.so libcrypto_python.so libsqlite3_python.so libssl_python.so; do
            if [ -f "$so" ]; then
              cp "$so" "$WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
              echo "  ✅ $so"
            fi
          done

          # ---- 5. Tải yt-dlp wheel (pure Python) ----
          echo "📥 Downloading yt-dlp wheel..."
          mkdir -p "$WORKSPACE/_wheels"
          cd "$WORKSPACE/_wheels"
          python3 -m pip download yt-dlp certifi \
            --no-deps --only-binary=:all: -d .

          ls -la

          # ---- 6. Extract wheels vào assets/python/site-packages ----
          SITE_PACKAGES="$WORKSPACE/app/src/main/assets/python/site-packages"
          mkdir -p "$SITE_PACKAGES"
          cd "$WORKSPACE/_wheels"

          for whl in *.whl; do
            echo "  Extracting: $whl"
            unzip -q "$whl" -d "$SITE_PACKAGES"
          done

          echo ""
          echo "site-packages contents:"
          ls "$SITE_PACKAGES" | head -20

          echo ""
          echo "=== DONE ==="
          echo "jniLibs:"
          ls -lh "$WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
          echo "site-packages size:"
          du -sh "$SITE_PACKAGES"

      # Setup keystore
      - name: Setup debug keystore
        run: |
          set -e
          mkdir -p ~/.android
          if [ -f "debug.keystore" ]; then
            cp debug.keystore ~/.android/debug.keystore
          else
            keytool -genkey -v -keystore ~/.android/debug.keystore \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Build APK
      - name: Build release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          set -e
          VERSION=${{ steps.bump.outputs.new_version }}
          for f in app/build/outputs/apk/release/*.apk; do
            [[ "$f" != *".apk" ]] || [[ "$f" == *"-unaligned"* ]] && continue
            DIR=$(dirname "$f"); BASE=$(basename "$f" .apk)
            mv "$f" "${DIR}/${BASE}-v${VERSION}.apk"
          done
          ls -la app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: Mini-Y2mate-Pro-v${{ steps.bump.outputs.new_version }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error