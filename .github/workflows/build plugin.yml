name: Build Plugin APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - nam348tnh3gp-patch-1
    paths:
      - 'plugin/**'
      - 'settings.gradle.kts'
      - '.github/workflows/build-plugin.yml'

concurrency:
  group: build-plugin
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Bump plugin version code
        id: bump
        run: |
          set -e
          F="plugin/versioncode.txt"
          if [ -f "$F" ]; then
            C=$(cat "$F" | tr -d '[:space:]')
            C=${C:-0}
          else
            C=0
          fi
          if ! [[ "$C" =~ ^[0-9]+$ ]]; then C=0; fi
          N=$((C + 1))
          echo "$N" > "$F"
          echo "new_version=$N" >> "$GITHUB_OUTPUT"

      - name: Commit plugin version bump
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin/versioncode.txt
          if git diff --staged --quiet; then
            echo "no change"
          else
            git commit -m "chore(plugin): bump version to ${{ steps.bump.outputs.new_version }} [skip ci]"
            git pull --rebase origin "${{ github.ref_name }}" || true
            git push origin "HEAD:${{ github.ref_name }}"
          fi

      - name: Setup debug keystore
        run: |
          mkdir -p "$HOME/.android"
          if [ -f "debug.keystore" ]; then
            cp debug.keystore "$HOME/.android/debug.keystore"
          else
            keytool -genkey -v -keystore "$HOME/.android/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Build plugin APK
        run: gradle :plugin:assembleRelease --stacktrace

      - name: Rename APK
        run: |
          V="${{ steps.bump.outputs.new_version }}"
          for f in plugin/build/outputs/apk/release/*.apk; do
            if [[ "$f" != *".apk" ]] || [[ "$f" == *"-unaligned"* ]]; then continue; fi
            D=$(dirname "$f")
            B=$(basename "$f" .apk)
            mv "$f" "${D}/${B}-v${V}.apk"
          done
          ls -lh plugin/build/outputs/apk/release/

      - name: Report size
        run: |
          echo "Plugin APK:"
          ls -lh plugin/build/outputs/apk/release/*.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: plugin-v1.0.${{ steps.bump.outputs.new_version }}
          name: Mini-Y2mate Repository v1.0.${{ steps.bump.outputs.new_version }}
          body: |
            Plugin Repository cho Mini-Y2mate.
            Cung cấp pip index để tải wheel Android có sẵn.
          files: plugin/build/outputs/apk/release/*.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/upload-artifact@v4
        with:
          name: Mini-Y2mate-Repo-v${{ steps.bump.outputs.new_version }}
          path: plugin/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30